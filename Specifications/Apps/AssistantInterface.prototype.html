function go( view, id )
{
  state.view = view;
  state.project = view === 'project' ? id : null;
  state.chat = view === 'chat' ? id : null;
}

/** The conversation is drawn where it is shown: in the pane for a chat opened whole, else in the bar's conversation. */
function refreshConversation()
{
  if ( state.view === 'chat' )
    render();
  else
    renderDock();
}

// ---- Mila: the conversation, and where it takes you -----------------------------------------------------------------

function placementHtml( conversation )
{
  if ( conversation.placing )
    return '<span class="ring" aria-hidden="true"></span> Mila is placing this conversation';

  if ( conversation.thread === null )
  {
    if ( state.view === 'project' )
      return 'Talking about <button type="button" class="link where" data-do="open-project" data-id="' + state.project + '">' + escapeText( projects[ state.project ].name ) + '</button>';

    return 'Talking about <span class="where">your workspace</span>';
  }

  const thread = threads[ conversation.thread ];

  if ( thread.project )
    return 'In <button type="button" class="link where" data-do="open-project" data-id="' + thread.project + '">' + escapeText( projects[ thread.project ].name ) + '</button>';

  return 'Not in a project';
}


function renderDock()
{
  const conversation = state.conversation;
  const dock = document.getElementById( 'dock' );
  dock.classList.toggle( 'open', state.open );
  dock.classList.toggle( 'in-chat', state.view === 'chat' );

  document.getElementById( 'ask' ).placeholder = state.view === 'chat' ? 'Reply to Mila'
    : state.view === 'project' ? 'Ask Mila about ' + projects[ state.project ].name + ', or go anywhere in your workspace'
    : Object.keys( projects ).length ? 'Ask Mila: open a project, see what changed, or start something new'
    : 'Ask Mila anything, or open one of your chats';

  const title = conversation.thread === null ? 'Mila' : threads[ conversation.thread ].title;
  document.getElementById( 'conversation-title' ).textContent = title;
  document.getElementById( 'expand' ).hidden = conversation.thread === null;
  document.getElementById( 'placement' ).innerHTML = placementHtml( conversation );

  const list = document.getElementById( 'messages' );
  list.innerHTML = conversation.messages.map( renderMessage ).join( '' );
  list.scrollTop = list.scrollHeight;
}

function renderMessage( message )
{
  if ( message.who === 'you' ) return '<div class="message you">' + escapeText( message.text ) + '</div>';
  if ( message.who === 'thinking' ) return '<div class="thinking"><span class="ring" aria-hidden="true"></span>Thinking</div>';
  if ( message.who === 'went' ) return '<div class="went">' + escapeText( message.text ) + '</div>';
  if ( message.who === 'placed' ) return '<div class="placed"><div>' + message.html + '</div></div>';

  return '<div class="message mila"><div class="who-line">' + markSvg + 'Mila</div>' + message.html + '</div>';
}

function startConversation()
{
  state.conversation = { thread: null, placing: false, messages: [] };
}

/** Mila answers, then takes the pane where the answer is, and says where it went. */
function reply( html, suggestions, navigate, wentText )
{
  const messages = state.conversation.messages;
  messages.push( { who: 'thinking' } );
  refreshConversation();

  setTimeout( () =>
  {
    const thinking = messages.findIndex( ( message ) => message.who === 'thinking' );

    if ( thinking >= 0 )
      messages.splice( thinking, 1 );

    messages.push( { who: 'mila', html, suggestions } );

    if ( navigate )
    {
      const from = state.view;
      navigate();

      // Leaving a chat for somewhere else, the conversation goes on in the bar, risen over the new place.
      if ( from === 'chat' && state.view !== 'chat' )
        state.open = true;

      if ( wentText )
        messages.push( { who: 'went', text: wentText } );
    }

    render();
  }, reduced ? 0 : 600 );
}

/** A chat opens whole: the pane is the chat, and the bar below is its reply box. */
function openThread( id )
{
  state.conversation = { thread: id, placing: false, messages: chatMessages( id ) };
  go( 'chat', id );
  state.open = false;
  render();
}

function flash( selector )
{
  setTimeout( () =>
  {
    const target = document.querySelector( selector );

    if ( target )
    {
      target.scrollIntoView( { block: 'center', behavior: reduced ? 'auto' : 'smooth' } );
      target.classList.add( 'flash' );
    }
  }, 40 );
}

function projectMatching( text )
{
  const found = projectNamed( text );

  return found && projects[ found ] ? found : null;
}

function projectNamed( text )
{
  const lower = text.toLowerCase();

  if ( /calc/.test( lower ) ) return 'calc';
  if ( /kyoto|trip|japan/.test( lower ) ) return 'kyoto';
  if ( /format|llm|16 ?gb|quant/.test( lower ) ) return 'formats';
  if ( /garden|bed|plant/.test( lower ) ) return 'garden';
  if ( /paper|reading|memory/.test( lower ) ) return 'thesis';
  if ( /loop|reasoning/.test( lower ) && projects.loops ) return 'loops';

  return null;
}

/** The prototype's stand-in for the model: a few kinds of request, answered from the example workspace. */
function respond( text )
{
  const lower = text.toLowerCase();
  const project = projectMatching( text );

  if ( /back|home|workspace|overview|glance/.test( lower ) && !project )
  {
    const waiting = waitingNotices().length;
    reply( '<p>Here is your workspace. ' + waiting + ' things are waiting on you, and you have ' + seeds().length + ' chats outside any project.</p>', null, () => go( 'workspace' ), 'Opened your workspace' );

    return;
  }

  if ( /all (my )?chats|show (me )?(my )?chats|list .*chats|my chats|every chat/.test( lower ) )
  {
    reply( '<p>You have ' + Object.keys( threads ).length + ' chats' + ( Object.keys( projects ).length ? ', ' + seeds().length + ' of them outside any project' : '' ) + '. The newest is “' + escapeText( Object.values( threads ).sort( ( a, b ) => a.ago - b.ago )[ 0 ].title ) + '”.</p>', null,
      () => { go( 'chats' ); state.chatsFilter = 'all'; state.chatsQuery = ''; }, 'Opened all chats' );

    return;
  }

  if ( /projects?\b/.test( lower ) && Object.keys( projects ).length === 0 )
  {
    reply( '<p>You have no projects yet, and you don’t need one: each chat stands on its own. When several chats turn out to belong together, I’ll suggest making them a project.</p>', null, () => go( 'chats' ), 'Opened all chats' );

    return;
  }

  if ( /all (my )?projects|list .*projects|show .*projects|every project/.test( lower ) )
  {
    reply( '<p>You have ' + Object.keys( projects ).length + ' projects. The most recent is ' + escapeText( projectsByRecent()[ 0 ][ 1 ].name ) + '.</p>', [ 'Which projects are waiting on me?', 'Open the most recent one' ],
      () => { go( 'projects' ); state.projectsFilter = 'all'; state.projectsQuery = ''; }, 'Opened all projects' );

    return;
  }

  if ( /which projects .*(wait|need)/.test( lower ) )
  {
    const list = Object.values( projects ).filter( ( item ) => item.state === 'waiting' );
    reply( '<p>' + ( list.length === 1 ? 'One: ' : list.length + ': ' ) + list.map( ( item ) => escapeText( item.name ) ).join( ', ' ) + '.</p>', [ 'Open the calculator project' ],
      () => { go( 'projects' ); state.projectsFilter = 'waiting'; }, 'Showed the projects waiting on you' );

    return;
  }

  if ( /most recent/.test( lower ) )
  {
    const [ id, item ] = projectsByRecent()[ 0 ];
    reply( projectSummaryHtml( item ), null, () => go( 'project', id ), 'Opened ' + item.name );

    return;
  }

  if ( /what('|’)?s waiting|waiting on me|needs? me\b|needs my|anything pending/.test( lower ) )
  {
    const waiting = waitingNotices();
    const list = waiting.map( ( item ) => '<li><button type="button" class="link" data-do="continue" data-id="' + item.thread + '">' + escapeText( item.title ) + '</button> in ' + escapeText( projects[ item.project ].name ) + ': ' + escapeText( item.text ) + '</li>' ).join( '' );
    reply( waiting.length ? '<p>' + waiting.length + ' things:</p><ul>' + list + '</ul>' : '<p>Nothing is waiting on you.</p>', [ 'Answer and continue', 'Show all my projects' ],
      () => { go( 'workspace' ); flash( '#noticed' ); }, 'Showed what needs you' );

    return;
  }

  if ( /answer and continue|continue the test/.test( lower ) )
  {
    openThread( 't-tests' );

    return;
  }

  if ( /ask mila to finish|finish the (comparison|table|answer)/.test( lower ) )
  {
    openThread( 't-formats' );

    return;
  }

  if ( /what('|’)?s next|still open|open questions/.test( lower ) && state.view === 'project' )
  {
    const item = projects[ state.project ];
    reply( '<p>' + escapeText( item.understanding.next ) + '</p>' + ( item.understanding.questions.length ? '<p>Still open:</p><ul>' + item.understanding.questions.map( ( q ) => '<li>' + escapeText( q ) + '</li>' ).join( '' ) + '</ul>' : '' ), null, null, null );

    return;
  }

  if ( /(what|which).*(made|make|wrote|write|creat)|recently made|show .*files/.test( lower ) )
  {
    const scope = state.view === 'project' && !project ? state.project : project;
    const items = Object.entries( made ).filter( ( [ , item ] ) => !scope || item.project === scope ).sort( ( a, b ) => a[ 1 ].ago - b[ 1 ].ago ).slice( 0, 3 );
    const list = items.map( ( [ id, item ] ) => '<li><button type="button" class="link" data-do="open-made" data-id="' + id + '">' + escapeText( item.name ) + '</button> in ' + escapeText( projects[ item.project ].name ) + ', ' + when( item.ago ) + '</li>' ).join( '' );
    reply( items.length ? '<p>The most recent:</p><ul>' + list + '</ul><p>Each keeps where it came from.</p>' : '<p>Nothing made here yet.</p>', null,
      scope ? () => { go( 'project', scope ); flash( '#made-here' ); } : null, scope ? 'Opened ' + projects[ scope ].name : null );

    return;
  }

  if ( /what happened|activity|what('|’)?s new/.test( lower ) )
  {
    reply( '<p>Today you started thinking about reasoning loops and asked about the KV cache; the test plan wrote two files before stopping to ask you something.</p>', null, () => go( 'activity' ), 'Opened Activity' );

    return;
  }

  if ( project && /open|show|go|take me|where|let('|’)?s|work on/.test( lower ) )
  {
    reply( projectSummaryHtml( projects[ project ] ), [ 'What’s next here?', 'Back to my workspace' ], () => go( 'project', project ), 'Opened ' + projects[ project ].name );

    return;
  }

  if ( /^start (something new|a new project)$/i.test( text.trim() ) )
  {
    reply( '<p>Tell me what’s on your mind, however unformed. I’ll find where it fits as we go.</p>', null, null, null );

    return;
  }

  brainstorm( text );
}

function projectSummaryHtml( project )
{
  return '<p><b>' + escapeText( project.name ) + '</b>. ' + escapeText( project.understanding.summary ) + '</p><p><span class="label">Next</span><br>' + escapeText( project.understanding.next ) + '</p>';
}

/** Something new: a thread begins in no project, and Mila places it as the conversation shows what it is. */
function brainstorm( text )
{
  const id = 't-new-' + nextThread++;
  const title = text.length > 70 ? text.slice( 0, text.lastIndexOf( ' ', 68 ) ) + '…' : text;
  const loops = /agent|loop|reason|stuck|autonom/i.test( text );
  const inProject = state.view === 'project' ? state.project : null;

  threads[ id ] = { title, project: inProject, kind: 'Exploring', ago: 0, reply: '' };
  events.unshift( { ago: 0, who: 'you', type: 'conversation', text: 'Started a chat: ' + title, project: inProject ?? undefined, open: [ 'thread', id ] } );

  if ( inProject )
    projects[ inProject ].threads.unshift( id );

  // The new chat holds only what belongs to it: the thought that started it.
  threads[ id ].messages = [ { who: 'you', text } ];
  state.conversation = { thread: id, placing: !inProject, messages: threads[ id ].messages };

  if ( !inProject )
  {
    go( 'workspace' );
    state.arriving = id;
  }

  render();

  if ( !inProject )
    flash( '[data-seed="' + id + '"]' );

  const html = loops
    ? '<p>A good thread to pull. Three questions frame it: what the agent watches in itself, what counts as progress, and who decides it is finished.</p><p>This is close to three chats you already started.</p>'
    : '<p>Let’s explore it. What do you already know, and what made you think of it today?</p>';

  reply( html, null, () =>
  {
    state.conversation.placing = false;

    if ( inProject )
    {
      state.conversation.messages.push( { who: 'placed', html: 'This conversation is part of <b>' + escapeText( projects[ inProject ].name ) + '</b>, where you started it.' } );
    }
    else if ( loops && projects.loops )
    {
      threads[ id ].project = 'loops';
      projects.loops.threads.unshift( id );
      state.conversation.messages.push( { who: 'placed', html: 'Mila placed this conversation in <b>' + escapeText( projects.loops.name ) + '</b>. Say “keep it separate” to leave it in no project.' } );
      state.conversation.pending = { kind: 'unplace', thread: id };
    }
    else if ( loops )
    {
      const proposal = notices.find( ( item ) => item.kind === 'proposal' );

      if ( proposal && !proposal.threads.includes( id ) )
        proposal.threads.unshift( id );

      state.conversation.messages.push( { who: 'placed', offer: true, html: 'This belongs with your chats on reasoning loops. Gather all four into a project called <b>Agent reasoning loops</b>? Say yes, or keep talking.' } );
      state.conversation.pending = { kind: 'gather', notice: 'n-proposal' };
    }
    else
    {
      state.conversation.messages.push( { who: 'placed', html: 'This is a chat of its own, in no project. If it grows into one, Mila will suggest it.' } );
    }
  }, null );
}

function send( text )
{
  const trimmed = text.trim();

  if ( !trimmed )
    return;

  state.open = state.view !== 'chat';
  state.conversation.messages.push( { who: 'you', text: trimmed } );

  if ( state.conversation.thread )
    threads[ state.conversation.thread ].ago = 0;

  refreshConversation();

  // An offer Mila made is answered in words: yes takes it, no or anything else leaves it.
  const pending = state.conversation.pending;
  state.conversation.pending = null;

  if ( pending && pending.kind === 'gather' && /^(yes|yeah|sure|ok|okay|please|do it|make it)\b/i.test( trimmed ) )
  {
    reply( '<p>Gathering them now.</p>', null, () => makeProject( pending.notice ), null );

    return;
  }

  if ( pending && pending.kind === 'gather' && /^(no|not now|later)\b/i.test( trimmed ) )
  {
    reply( '<p>Leaving them as they are. I won’t suggest it again for these chats.</p>', null, () => { notices = notices.filter( ( item ) => item.id !== pending.notice ); }, null );

    return;
  }

  if ( pending && pending.kind === 'unplace' && /keep it (separate|unplaced)|in no project|take it out/i.test( trimmed ) )
  {
    reply( '<p>Done: this conversation is in no project.</p>', null, () => { threads[ pending.thread ].project = null; projects.loops.threads = projects.loops.threads.filter( ( item ) => item !== pending.thread ); }, null );

    return;
  }

  const thread = state.conversation.thread;
  const inChat = state.view === 'chat';
  const exploring = thread !== null && ( /^t-new/.test( thread ) || inChat );
  const navigating = projectMatching( trimmed ) || /waiting on me|what did mila make|what happened|activity|\bopen\b|\bshow\b|projects?\b|all (my )?chats|my chats|back to|workspace|what('|’)?s next|ask mila to finish|continue/.test( trimmed.toLowerCase() );

  // Asking to go somewhere is not part of the chat: it starts a conversation of its own, about the workspace.
  if ( thread !== null && navigating )
  {
    state.conversation.messages.pop();
    startConversation();
    state.conversation.messages.push( { who: 'you', text: trimmed } );
    state.open = true;
    renderDock();
  }

  if ( exploring && !navigating )
  {
    reply( inChat && !/^t-new/.test( thread ) ? '<p>An example reply: in Mila this is the model’s answer, and the chat goes on here.</p>' : '<p>Go on. Each turn tells me more about where this belongs.</p>', null, null, null );

    return;
  }

  respond( trimmed );
}

// ---- Making structure ------------------------------------------------------------------------------------------------

function makeProject( noticeId )
{
  const notice = notices.find( ( item ) => item.id === noticeId );

  if ( !notice )
    return;

  const input = document.getElementById( 'proposal-name' );
  const name = input && input.value.trim() ? input.value.trim() : notice.name;

  for ( const id of notice.threads )
    document.querySelector( '[data-seed="' + id + '"]' )?.classList.add( 'gather' );

  setTimeout( () =>
  {
    projects.loops = { name, purpose: notice.purpose, folder: null, state: 'active', pulse: [ 0, 0, 0, 0, 1, 0, 0, 0, 2, 0, 0, 0, 1, 3 ], ago: 0,
      understanding: { summary: 'Gathered from your chats: what an agent watches in itself, how it knows it is stuck, and catching repeated calls.',
        questions: [ 'What counts as progress for an agent?', 'Who decides a task is finished: the agent, or a check?' ],
        next: 'Look at how existing agents detect loops, then design an experiment.', nextAction: null },
      threads: notice.threads.slice(), made: [], plans: [], findings: [] };

    for ( const id of notice.threads )
      threads[ id ].project = 'loops';

    notices = notices.filter( ( item ) => item.id !== noticeId );
    events.unshift( { ago: 0, who: 'you', type: 'decision', text: 'Accepted Mila’s suggestion: made the project ' + name, project: 'loops', open: [ 'project', 'loops' ] } );
    state.undo = { text: 'Made “' + name + '” from ' + notice.threads.length + ' chats. It is now your most recent project.', notice };
    state.arriving = 'loops';
    go( 'workspace' );
    state.conversation.messages = state.conversation.messages.filter( ( message ) => !message.offer );

    if ( state.conversation.thread && threads[ state.conversation.thread ].project === 'loops' )
      state.conversation.messages.push( { who: 'placed', html: 'Mila made <b>' + escapeText( name ) + '</b> and placed this conversation in it.' } );

    render();
    flash( '[data-card="loops"]' );
  }, reduced ? 0 : 420 );
}

function undoProject()
{
  for ( const id of projects.loops.threads )
    threads[ id ].project = null;

  delete projects.loops;

  const index = events.findIndex( ( event ) => event.project === 'loops' && event.type === 'decision' );

  if ( index >= 0 )
    events.splice( index, 1 );

  notices.unshift( state.undo.notice );
  state.undo = null;
  render();
}

// ---- Drawers and the palette -----------------------------------------------------------------------------------------

function closeLayer() { document.getElementById( 'layer' ).innerHTML = ''; }

function openDrawer( html )
{
  document.getElementById( 'layer' ).innerHTML = '<div class="scrim" data-do="close"></div><div class="drawer" role="dialog" aria-modal="true">'
    + '<div style="display:flex;justify-content:flex-end"><button type="button" class="icon-button" data-do="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' + html + '</div>';
  document.querySelector( '.drawer .icon-button' ).focus();
}

function openMade( id )
{
  const item = made[ id ];
  const project = projects[ item.project ];
  const thread = threads[ item.thread ];
  const plan = item.plan ? plans[ item.plan ] : null;
  const writes = item.writes.map( ( [ ago, what ] ) => escapeText( what ) + ', ' + when( ago ) ).join( '<br>' );

  let html = '<span class="label">Made by Mila</span><h3>' + escapeText( item.name ) + '</h3><div class="row-sub">' + escapeText( item.path ) + '</div>';

  if ( item.changed )
    html += '<div class="notice waiting" style="margin-top:14px"><div class="notice-text">Changed on disk after Mila last wrote it. Mila reads your version before writing again.</div></div>';

  html += '<div class="preview">' + escapeText( item.preview ) + '</div><div class="provenance">'
    + '<div class="prov"><span class="label">For</span><div class="prov-body"><button type="button" class="link" data-do="open-project" data-id="' + item.project + '">' + escapeText( project.name ) + '</button>: ' + escapeText( project.purpose ) + '</div></div>'
    + '<div class="prov"><span class="label">In the conversation</span><div class="prov-body"><button type="button" class="link" data-do="open-thread" data-id="' + item.thread + '">' + escapeText( thread.title ) + '</button></div></div>'
    + ( plan ? '<div class="prov"><span class="label">During</span><div class="prov-body">Step ' + item.step + ' of <button type="button" class="link" data-do="open-plan" data-id="' + item.plan + '">the test plan</button>: ' + escapeText( plan.steps[ item.step - 1 ][ 0 ] ) + '</div></div>' : '' )
    + '<div class="prov"><span class="label">Read first</span><div class="prov-body">' + item.read.map( escapeText ).join( '<br>' ) + '</div></div>'
    + '<div class="prov"><span class="label">By</span><div class="prov-body">Mila, with Gemma 4 12B</div></div>'
    + '<div class="prov"><span class="label">Writes</span><div class="prov-body">' + writes + '</div></div></div>';

  openDrawer( html );
}

function openPlan( id )
{
  const plan = plans[ id ];
  const ticks = { done: '✓', now: '●', pending: '○' };
  const steps = plan.steps.map( ( [ text, status ], index ) => '<div class="step ' + status + '"><span class="tick">' + ticks[ status ] + '</span><span>' + ( index + 1 ) + '. ' + escapeText( text ) + '</span></div>' ).join( '' );
  const runs = plan.runs.map( ( run, index ) => '<div class="row-sub">Run ' + ( index + 1 ) + ', ' + when( run.ago ) + ': ' + escapeText( run.end ) + '</div>' ).join( '' );

  openDrawer( '<span class="label">Plan</span><h3 style="font-family:var(--sans)">' + escapeText( plan.goal ) + '</h3><div class="steps" style="margin-top:16px">' + steps + '</div>'
    + '<div style="margin-top:18px"><span class="label">Runs</span>' + runs + '</div>'
    + '<div class="notice-actions" style="margin-top:16px"><button type="button" class="button primary" data-do="continue" data-id="' + plan.thread + '">Continue this run</button><button type="button" class="button">Run again</button></div>'
    + '<p class="row-sub" style="margin-top:12px">Running again starts a new run of the same steps beside this one; the model will not do it identically.</p>' );
}

function paletteItems()
{
  const items = [];

  for ( const [ id, project ] of projectsByRecent() ) items.push( { kind: 'Project', label: project.name, act: [ 'open-project', id ] } );
  for ( const [ id, thread ] of Object.entries( threads ) ) items.push( { kind: thread.project ? 'Chat in ' + projects[ thread.project ].name : 'Chat', label: thread.title, act: [ 'open-thread', id ] } );
  for ( const [ id, item ] of Object.entries( made ) ) if ( projects[ item.project ] ) items.push( { kind: 'File', label: item.name, act: [ 'open-made', id ] } );

  return items;
}

function openPalette()
{
  document.getElementById( 'layer' ).innerHTML = '<div class="palette-wrap" data-do="close-outside"><div class="palette" role="dialog" aria-modal="true" aria-label="Jump to">'
    + '<label for="palette-input" hidden>Jump to</label><input id="palette-input" placeholder="Jump to a project, a chat or a file" autocomplete="off"><div class="palette-list" id="palette-list" role="listbox"></div></div></div>';

  const input = document.getElementById( 'palette-input' );
  let selected = 0;

  function fill()
  {
    const query = input.value.toLowerCase();
    const matches = paletteItems().filter( ( item ) => item.label.toLowerCase().includes( query ) || item.kind.toLowerCase().includes( query ) ).slice( 0, 12 );
    selected = Math.min( selected, Math.max( 0, matches.length - 1 ) );
    document.getElementById( 'palette-list' ).innerHTML = matches.map( ( item, index ) => '<button type="button" class="palette-item" role="option" aria-selected="' + ( index === selected ) + '" data-do="' + item.act[ 0 ] + '" data-id="' + item.act[ 1 ] + '"><span>' + escapeText( item.label ) + '</span><span class="palette-kind">' + escapeText( item.kind ) + '</span></button>' ).join( '' );
  }

  input.addEventListener( 'input', () => { selected = 0; fill(); } );
  input.addEventListener( 'keydown', ( event ) =>
  {
    const options = document.querySelectorAll( '.palette-item' );

    if ( event.key === 'ArrowDown' ) { selected = Math.min( selected + 1, options.length - 1 ); fill(); event.preventDefault(); }
    if ( event.key === 'ArrowUp' ) { selected = Math.max( selected - 1, 0 ); fill(); event.preventDefault(); }
    if ( event.key === 'Enter' && options[ selected ] ) options[ selected ].click();
  } );

  fill();
  input.focus();
}

let popoverFor = null;

/** A small panel beside the control that opened it: below it, or above it for the sidebar's foot. Fixed, so the sidebar's scrolling never clips it. */
function togglePopover( kind, button )
{
  const open = document.querySelector( '.popover' );
  open?.remove();

  if ( open && popoverFor === kind )
  {
    popoverFor = null;

    return;
  }

  const contents = {
    model: '<span class="label">The intelligence</span><div style="margin-top:4px;font-weight:600">Gemma 4 12B</div>'
      + '<dl><dt>Chosen</dt><dd>By Mila, for this computer</dd><dt>Context</dt><dd>56,320 tokens, automatic</dd><dt>Thinking</dt><dd>On</dd><dt>This conversation</dt><dd>18% of its context</dd></dl>'
      + '<p>Change the model in Settings.</p>',
    'user-menu': '<div style="font-weight:600">Todd Thomson</div><div class="row-sub">Workspace owner</div><div class="menu">'
      + '<button type="button" class="menu-item" data-do="settings"><span>Settings</span><small>' + ( shortcut.startsWith( '⌘' ) ? '⌘,' : 'Ctrl ,' ) + '</small></button>'
      + '<button type="button" class="menu-item"><span>Mila’s licence</span><small></small></button>'
      + '<button type="button" class="menu-item"><span>About Mila Assistant</span><small>0.21.0</small></button>'
      + '<button type="button" class="menu-item"><span>Quit Mila</span><small></small></button></div>'
  };

  const popover = document.createElement( 'div' );
  const rect = button.getBoundingClientRect();
  const up = rect.top > window.innerHeight / 2;

  popover.className = 'popover';
  popover.innerHTML = contents[ kind ];
  popover.style.left = Math.max( 8, Math.min( rect.left, window.innerWidth - 288 ) ) + 'px';

  if ( up )
    popover.style.bottom = ( window.innerHeight - rect.top + 6 ) + 'px';
  else
    popover.style.top = ( rect.bottom + 6 ) + 'px';

  document.body.append( popover );
  popoverFor = kind;
}

function openSettings()
{
  openDrawer( '<span class="label">Mila Assistant</span><h3 style="font-family:var(--sans)">Settings</h3>'
    + '<div class="rows" style="margin-top:16px">'
    + '<div class="row"><span class="row-main"><div class="row-title">Models</div><div class="row-sub">Gemma 4 12B, chosen by Mila for this computer</div></span><span class="row-when">Manage</span></div>'
    + '<div class="row"><span class="row-main"><div class="row-title">Responses</div><div class="row-sub">Thinking on, context automatic</div></span></div>'
    + '<div class="row"><span class="row-main"><div class="row-title">Web search</div><div class="row-sub">Not set up</div></span></div>'
    + '<div class="row"><span class="row-main"><div class="row-title">Build &amp; Code</div><div class="row-sub">Running commands is off</div></span></div>'
    + '<div class="row"><span class="row-main"><div class="row-title">Display</div><div class="row-sub">Light and dark follow the system</div></span></div>'
    + '</div><p class="row-sub" style="margin-top:12px">The areas the app’s Settings window has today.</p>' );
}

function toggleSide( open )
{
  const side = document.getElementById( 'side' );
  const show = open ?? !side.classList.contains( 'open' );

  side.classList.toggle( 'open', show );
  document.querySelector( '.side-scrim' ).hidden = !show;
}

// ---- Wiring ----------------------------------------------------------------------------------------------------------

document.addEventListener( 'click', ( event ) =>
{
  const target = event.target.closest( '[data-do]' );

  if ( !target )
  {
    if ( !event.target.closest( '.popover' ) )
      document.querySelector( '.popover' )?.remove();

    return;
  }

  const id = target.dataset.id;
  const action = target.dataset.do;
  const popoverKinds = [ 'model', 'user-menu' ];

  if ( !popoverKinds.includes( action ) )
  {
    document.querySelector( '.popover' )?.remove();
    popoverFor = null;
  }

  // On a narrow window the sidebar closes once you have gone somewhere from it.
  if ( target.closest( '#side' ) && !popoverKinds.includes( action ) )
    toggleSide( false );

  if ( action === 'close-outside' && event.target !== target )
    return;

  if ( [ 'open-project', 'open-thread', 'open-made', 'open-plan', 'close', 'close-outside', 'continue', 'all-projects', 'all-chats' ].includes( action ) )
    closeLayer();

  switch ( action )
  {
    case 'activity': go( 'activity' ); render(); break;
    case 'side-toggle': toggleSide(); break;
    case 'settings': openSettings(); break;
    case 'new-project': send( 'Start a new project' ); break;
    case 'workspace': go( 'workspace' ); render(); break;
    case 'all-projects': go( 'projects' ); render(); break;
    case 'all-chats': go( 'chats' ); render(); break;
    case 'chats-filter': state.chatsFilter = target.dataset.value; render(); break;
    case 'expand': if ( state.conversation.thread ) { go( 'chat', state.conversation.thread ); state.open = false; render(); } break;
    case 'section': flash( '#' + id ); break;
    case 'projects-filter': state.projectsFilter = target.dataset.value; render(); break;
    case 'activity-filter': state.activityFilter = target.dataset.value; render(); break;
    case 'open-project': go( 'project', id ); render(); break;
    case 'open-thread': case 'continue': openThread( id ); break;
    case 'open-made': openMade( id ); break;
    case 'open-plan': openPlan( id ); break;
    case 'make-project': makeProject( id ); break;
    case 'dismiss': notices = notices.filter( ( item ) => item.id !== id ); state.conversation.messages = state.conversation.messages.filter( ( message ) => !message.offer ); render(); break;
    case 'undo': undoProject(); break;
    case 'new-conversation': startConversation(); renderDock(); document.getElementById( 'ask' ).focus(); break;
    case 'lower': state.open = false; renderDock(); break;
    case 'palette': openPalette(); break;
    case 'model': case 'user-menu': togglePopover( action, target ); break;
    case 'scroll-to': document.getElementById( id )?.scrollIntoView( { block: 'start', behavior: reduced ? 'auto' : 'smooth' } ); break;
  }
} );

const ask = document.getElementById( 'ask' );

document.getElementById( 'composer' ).addEventListener( 'submit', ( event ) =>
{
  event.preventDefault();
  const text = ask.value;
  ask.value = '';
  ask.style.height = '';
  send( text );
} );

ask.addEventListener( 'keydown', ( event ) =>
{
  if ( event.key === 'Enter' && !event.shiftKey )
  {
    event.preventDefault();
    document.getElementById( 'composer' ).requestSubmit();
  }
} );

ask.addEventListener( 'input', () => { ask.style.height = ''; ask.style.height = Math.min( ask.scrollHeight, 140 ) + 'px'; } );
ask.addEventListener( 'focus', () => { if ( state.conversation.messages.length ) { state.open = true; renderDock(); } } );

document.addEventListener( 'keydown', ( event ) =>
{
  if ( ( event.metaKey || event.ctrlKey ) && event.key.toLowerCase() === 'k' )
  {
    event.preventDefault();
    openPalette();
  }

  if ( ( event.metaKey || event.ctrlKey ) && event.key === ',' )
  {
    event.preventDefault();
    openSettings();
  }

  if ( event.key === 'Escape' )
  {
    if ( document.getElementById( 'layer' ).innerHTML ) closeLayer();
    else if ( state.open ) { state.open = false; renderDock(); }

    document.querySelector( '.popover' )?.remove();
  }
} );


// ---- The prototype's own switch: the same person, with projects or with chats alone --------------------------------

let stash = null;

function setExample( kind )
{
  if ( kind === state.example )
    return;

  if ( kind === 'chats' )
  {
    stash = { projects: { ...projects }, placed: Object.fromEntries( Object.entries( threads ).map( ( [ id, thread ] ) => [ id, thread.project ] ) ), notices };

    for ( const id of Object.keys( projects ) )
      delete projects[ id ];

    // Someone who only chats has the chats, and none of the work a project holds.
    for ( const [ id, thread ] of Object.entries( threads ) )
    {
      if ( thread.project !== null )
        delete threads[ id ];
    }

    notices = notices.filter( ( item ) => item.kind === 'proposal' );
  }
  else if ( stash )
  {
    Object.assign( projects, stash.projects );
    notices = stash.notices;
    stash = null;
    location.reload();

    return;
  }

  state.example = kind;
  state.undo = null;
  startConversation();
  go( 'workspace' );
  state.open = false;
  render();
}

document.getElementById( 'example' ).addEventListener( 'change', ( event ) => setExample( event.target.value ) );

startConversation();
render();
} )();
</script>
