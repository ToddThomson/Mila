<title>Mila Assistant Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one pane. The workspace fills the window; Mila is a bar docked at its foot, and the conversation rises over
   the pane while you talk, moving the pane to what it is about. Projects are the containers; a project opens on its
   summary, with a sidebar that lists that project. Type: the system's own faces, as the app ships no web fonts.
   Color: Mila's structure blue and action teal over a blue-biased neutral. */
:root {
  --ground: #f4f6f9;
  --surface: #ffffff;
  --sunk: #eceff4;
  --ink: #14171d;
  --ink-2: #4b5262;
  --ink-3: #868d9c;
  --rule: #dfe3ea;
  --brand: #0a40c2;
  --action: #0b7a85;
  --action-soft: #ddf1f3;
  --attention: #a8520b;
  --attention-soft: #fbeee2;
  --pulse: #b9c6e6;
  --scrim: rgba(20, 23, 29, .32);
  --shadow: 0 12px 32px rgba(20, 23, 29, .14), 0 1px 3px rgba(20, 23, 29, .08);
  --lift: 0 -8px 30px rgba(20, 23, 29, .12), 0 -1px 3px rgba(20, 23, 29, .06);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1014; --surface: #161920; --sunk: #1c2029; --ink: #e7e9ef; --ink-2: #a2a8b6; --ink-3: #6c7282;
    --rule: #272b35; --brand: #86a6ff; --action: #2fc4d4; --action-soft: #0f2a2f; --attention: #f0a35b;
    --attention-soft: #2b1f14; --pulse: #33415f; --scrim: rgba(0, 0, 0, .55);
    --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    --lift: 0 -8px 30px rgba(0, 0, 0, .5), 0 -1px 3px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --ground: #0e1014; --surface: #161920; --sunk: #1c2029; --ink: #e7e9ef; --ink-2: #a2a8b6; --ink-3: #6c7282;
  --rule: #272b35; --brand: #86a6ff; --action: #2fc4d4; --action-soft: #0f2a2f; --attention: #f0a35b;
  --attention-soft: #2b1f14; --pulse: #33415f; --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  --lift: 0 -8px 30px rgba(0, 0, 0, .5), 0 -1px 3px rgba(0, 0, 0, .4); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* The sidebar: the workspace, the places in it, its projects and recent chats; at its foot Settings, the model as a
   quiet fact, and you. The content beside it has a slim bar saying where you are. */
:root { --side-width: 256px; }
.app { grid-template-columns: var(--side-width) minmax(0, 1fr); grid-template-rows: none; }
.content { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.side {
  display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto;
  padding: 12px 10px calc(10px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--rule); background: var(--surface);
}
.side-workspace { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 8px; padding: 8px; border: 1px solid var(--rule); border-radius: 12px; background: var(--ground); text-align: left; }
.side-workspace:hover { border-color: color-mix(in srgb, var(--action) 45%, var(--rule)); }
.side-mark { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: var(--surface); }
.side-mark svg { width: 20px; height: 20px; }
.side-name { flex: 1; min-width: 0; }
.side-name b { display: block; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
.side-name span { display: block; color: var(--ink-3); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.side-chevrons { flex: none; width: 16px; height: 16px; color: var(--ink-3); }
.side-item { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; padding: 7px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-size: 13.5px; text-align: left; }
.side-item:hover { background: var(--sunk); color: var(--ink); }
.side-item[aria-current="page"] { background: var(--sunk); color: var(--ink); font-weight: 600; }
.side-item svg { flex: none; width: 17px; height: 17px; }
.side-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-count, .side-item kbd { flex: none; padding: 0 6px; border: 1px solid var(--rule); border-radius: 5px; color: var(--ink-3); font-family: var(--sans); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
.side-rule { height: 1px; margin: 8px 6px; background: var(--rule); }
.side-title { display: flex; justify-content: space-between; margin: 12px 10px 4px; color: var(--ink-3); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.side-dot { flex: none; width: 8px; height: 8px; margin: 0 4px; border-radius: 50%; background: var(--ink-3); }
.side-dot.waiting { background: var(--attention); }
.side-dot.active { background: var(--action); }
.side-dot.quiet { background: color-mix(in srgb, var(--ink-3) 60%, transparent); }
.side-quiet { color: var(--ink-3); }
.side-foot { display: flex; flex-direction: column; gap: 2px; margin-top: auto; padding-top: 10px; }
.side-model { color: var(--ink-3); font-size: 12.5px; }
.dot { flex: none; width: 7px; height: 7px; margin: 0 5px; border-radius: 50%; background: var(--action); }
.side-user { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 6px; padding: 8px; border: 0; border-top: 1px solid var(--rule); border-radius: 0; background: none; text-align: left; }
.side-user:hover { background: var(--sunk); border-radius: 10px; }
.avatar { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--sunk); color: var(--ink-2); font-size: 12px; font-weight: 650; }
.side-user .side-name b { font-size: 13.5px; }
.side-user .side-name span { font-size: 11.5px; letter-spacing: 0; text-transform: none; }

.bar {
  display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 52px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--surface);
}
.bar .menu-button { display: none; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.crumbs svg { flex: none; width: 15px; height: 15px; }
.crumbs button { border: 0; padding: 0; background: none; color: var(--ink-2); }
.crumbs button:hover { color: var(--action); }
.crumbs .here { overflow: hidden; color: var(--ink); text-overflow: ellipsis; }
.spacer { flex: 1; }
.example-switch { padding: 0 2px; border: 0; background: none; color: var(--ink-2); font-size: 11px; }
.prototype-tag { padding: 2px 7px; border: 1px dashed var(--ink-3); border-radius: 999px; color: var(--ink-3); font-size: 11px; white-space: nowrap; }

.popover {
  position: fixed; z-index: 55; width: 280px; padding: 12px 14px;
  border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow);
  color: var(--ink); font-size: 13px; text-align: left; cursor: default;
}
.menu { display: flex; flex-direction: column; gap: 2px; margin: 6px -6px 0; }
.menu-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
.menu-item:hover { background: var(--sunk); }
.menu-item small { color: var(--ink-3); font-size: 11.5px; }
.popover dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 10px 0 0; }
.popover dt { color: var(--ink-3); }
.popover dd { margin: 0; font-variant-numeric: tabular-nums; }
.popover p { margin: 10px 0 0; color: var(--ink-3); font-size: 12px; }

/* The one pane. */
.main { position: relative; min-width: 0; min-height: 0; overflow-y: auto; }
.main-inner {
  max-width: 1080px; margin: 0 auto; padding-block: 28px 140px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.eyebrow { color: var(--ink-3); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
h1 { margin: 4px 0 0; font-size: 30px; font-weight: 680; letter-spacing: -.025em; text-wrap: balance; }
.lead { margin: 6px 0 0; max-width: 64ch; color: var(--ink-2); font-size: 15px; }
.lead b { color: var(--ink); font-weight: 600; }
.section { margin-top: 30px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; margin-bottom: 10px; }
h2 { margin: 0; font-size: 13px; font-weight: 650; color: var(--ink-2); letter-spacing: .01em; }
.section-note { color: var(--ink-3); font-size: 12.5px; }

/* At a glance: the state of the workspace, or of a project, in figures a person reads in one look. */
.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; margin-top: 18px; border: 1px solid var(--rule); border-radius: 14px; background: var(--rule); overflow: hidden; }
.figure { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 14px 16px; border: 0; background: var(--surface); text-align: left; }
button.figure:hover { background: var(--sunk); }
.figure-value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.figure-label { color: var(--ink-2); font-size: 13px; }
.figure-note { color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.figure.attention .figure-value { color: var(--attention); }

.notices { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.notice { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
.notice.waiting { border-color: color-mix(in srgb, var(--attention) 35%, var(--rule)); background: var(--attention-soft); }
.notice-kind { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.notice.waiting .notice-kind { color: var(--attention); }
.notice.proposal .notice-kind { color: var(--brand); }
.notice-title { font-weight: 600; }
.notice-text { color: var(--ink-2); }
.notice-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.notice.proposal { grid-column: 1 / -1; border-color: color-mix(in srgb, var(--brand) 30%, var(--rule)); }
.proposal-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.proposal-name { width: 100%; padding: 6px 9px; border: 1px solid var(--rule); border-radius: 8px; background: var(--ground); font-weight: 600; }
.proposal-threads { display: flex; flex-direction: column; gap: 6px; }
.joined { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.joined::before { content: ""; flex: none; width: 8px; height: 8px; border: 1.5px dashed var(--brand); border-radius: 50%; }

.button { padding: 5px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); font-size: 13px; }
.button:hover { border-color: var(--action); color: var(--action); }
.button.primary { border-color: transparent; background: var(--action); color: var(--surface); font-weight: 600; }
.button.primary:hover { color: var(--surface); filter: brightness(1.08); }
.button.quiet { border-color: transparent; background: none; color: var(--ink-2); }
.link { padding: 0; border: 0; background: none; color: var(--action); text-align: left; }
.link:hover { text-decoration: underline; }

/* Projects: solid cards with their rhythm. Threads still forming: dashed seeds. */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.project-card { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 14px 16px 12px; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); text-align: left; }
.project-card:hover { border-color: color-mix(in srgb, var(--action) 55%, var(--rule)); }
.project-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.project-name { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.project-purpose { color: var(--ink-2); font-size: 13px; }
.state { flex: none; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.state.waiting { background: var(--attention-soft); color: var(--attention); }
.state.active { background: var(--action-soft); color: var(--action); }
.state.quiet { background: var(--sunk); color: var(--ink-3); }
.pulse { display: flex; align-items: flex-end; gap: 3px; height: 26px; }
.pulse i { flex: 1; min-height: 2px; border-radius: 2px; background: var(--pulse); }
.pulse i:last-child { background: var(--brand); }
.project-foot { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-3); font-size: 12px; }
.project-latest { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.counts { flex: none; font-variant-numeric: tabular-nums; }

.seeds { display: flex; flex-wrap: wrap; gap: 8px; }
.seed { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 7px 12px; border: 1.5px dashed var(--rule); border-radius: 999px; background: none; font-size: 13px; text-align: left; }
.seed:hover { border-color: var(--action); }
.seed.related { border-color: color-mix(in srgb, var(--brand) 60%, var(--rule)); }
.seed-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seed-when { flex: none; color: var(--ink-3); font-size: 12px; }

.chat-preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-row .row-main { flex: 1; }
.related-mark { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border: 1.5px dashed var(--brand); border-radius: 50%; vertical-align: 1px; }
.made { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.file { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); text-align: left; }
.file:hover { border-color: var(--action); }
.file-name { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-where { color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.changed { color: var(--attention); }

/* All projects: every project, searched, filtered and sorted, one row each. */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
.search { flex: 1 1 220px; min-width: 0; padding: 7px 11px; border: 1px solid var(--rule); border-radius: 9px; background: var(--surface); }
.filter { padding: 4px 11px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.filter[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.sort { padding: 5px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); font-size: 12.5px; }
.table { margin-top: 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); overflow: hidden; }
.table-row { display: grid; grid-template-columns: minmax(0, 2.2fr) 120px minmax(0, 1.6fr) 110px; gap: 14px; align-items: center; width: 100%; padding: 11px 16px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; }
.table-row:first-child { border-top: 0; }
button.table-row:hover { background: var(--sunk); }
.table-head { color: var(--ink-3); font-size: 12px; background: var(--ground); }
.cell-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-sub { color: var(--ink-3); font-size: 12.5px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-latest { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-counts { color: var(--ink-3); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.empty { padding: 22px 16px; color: var(--ink-3); text-align: center; }

/* One chat with the pane to itself: a reading column, and the bar below as its reply box. */
.chat-view { max-width: 760px; margin: 0 auto; }
.chat-title { font-size: 24px; }
.chat-placement { display: block; margin-top: 6px; font-size: 13px; }
.chat-messages { display: flex; flex-direction: column; gap: 18px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 15px; }
.dock.in-chat .conversation { display: none; }

/* Activity: one timeline of everything, by day. */
.day { margin-top: 26px; }
.timeline { display: flex; flex-direction: column; margin-top: 8px; border-left: 1px solid var(--rule); }
.event { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 7px 0 7px 14px; position: relative; }
.event::before { content: ""; position: absolute; left: -4.5px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--ink-3); }
.event.mila::before { border-color: var(--brand); background: var(--brand); }
.event-time { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.event-text { min-width: 0; }
.event-where { color: var(--ink-3); font-size: 12px; }

/* Inside a project: its summary first, and a sidebar that lists the project, because here it means something. */
.project-view { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 28px; }
.project-nav { position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: 2px; padding-top: 6px; }
.project-nav button { display: flex; justify-content: space-between; padding: 6px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); text-align: left; }
.project-nav button:hover { background: var(--sunk); color: var(--ink); }
.nav-count { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-title { margin: 14px 10px 6px; color: var(--ink-3); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
.nav-title:first-child { margin-top: 0; }
.project-main { min-width: 0; }
.project-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.chip { padding: 2px 9px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-2); font-size: 12px; font-family: var(--mono); }
.summary { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1px; margin-top: 18px; border: 1px solid var(--rule); border-radius: 14px; background: var(--rule); overflow: hidden; }
.summary > div { padding: 16px 18px; background: var(--surface); min-width: 0; }
.summary p { margin: 6px 0 0; }
.summary ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); }
.summary .next-action { margin-top: 12px; }
.label { color: var(--ink-3); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
.rows { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); overflow: hidden; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 14px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--sunk); }
.row-main { min-width: 0; }
.row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { color: var(--ink-3); font-size: 12.5px; }
.row-when { flex: none; color: var(--ink-3); font-size: 12px; }
.steps { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.step { display: flex; gap: 8px; font-size: 13px; color: var(--ink-2); }
.step .tick { flex: none; width: 16px; text-align: center; color: var(--ink-3); }
.step.done .tick { color: var(--action); }
.step.now { color: var(--ink); font-weight: 600; }
.step.now .tick { color: var(--attention); }
.bar-track { height: 4px; margin-top: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar-fill { height: 100%; background: var(--action); }
.finding { padding: 10px 14px; border-top: 1px solid var(--rule); }
.finding:first-child { border-top: 0; }
.finding-sources { margin-top: 2px; color: var(--ink-3); font-size: 12px; }

/* Mila: a bar at the foot of the pane; the conversation rises above it while you talk. */
.dock {
  position: fixed; left: calc(var(--side-width) + (100vw - var(--side-width)) / 2); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 36; transform: translateX(-50%);
  width: min(760px, calc(100vw - var(--side-width) - 2 * max(16px, env(safe-area-inset-left, 0px))));
}
/* The pane fades out under the bar, so the bar never sits on top of a card. */
.dock-fade {
  position: fixed; left: var(--side-width); right: 0; bottom: 0; z-index: 35; height: calc(110px + env(safe-area-inset-bottom, 0px)); pointer-events: none;

  projectsQuery: '', projectsFilter: 'all', projectsSort: 'recent',
  chatsQuery: '', chatsFilter: 'all',
  activityFilter: 'all',
  conversation: null,         // { thread, placing, messages }
  open: false,                // the conversation risen over the pane
  arriving: null,
  undo: null
};
let nextThread = 1;

// ---- Words -------------------------------------------------------------------------------------------------------

function escapeText( text )
{
  return String( text ).replace( /[&<>"']/g, ( c ) => ( { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } )[ c ] );
}

/** Text from the page's own reply markup, for a one-line preview. */
function plainText( html )
{
  const holder = document.createElement( 'div' );
  holder.innerHTML = html;

  return holder.textContent.replace( /\s+/g, ' ' ).trim();
}

const weekday = new Intl.DateTimeFormat( 'en-US', { weekday: 'long' } );
const monthDay = new Intl.DateTimeFormat( 'en-US', { month: 'short', day: 'numeric' } );
const clock = new Intl.DateTimeFormat( 'en-US', { hour: 'numeric', minute: '2-digit' } );
const longDate = new Intl.DateTimeFormat( 'en-US', { weekday: 'long', month: 'long', day: 'numeric' } );

function dayStart( time ) { const d = new Date( time ); return new Date( d.getFullYear(), d.getMonth(), d.getDate() ).getTime(); }

function when( ago )
{
  const time = now - ago * minute;
  const today = dayStart( now );

  if ( ago < 1 ) return 'Just now';
  if ( ago < 60 ) return ago + ' min ago';
  if ( time >= today ) return Math.floor( ago / 60 ) + ' h ago';
  if ( time >= today - 864e5 ) return 'Yesterday';
  if ( time >= today - 6 * 864e5 ) return weekday.format( time );

  return monthDay.format( time );
}

function dayLabel( ago )
{
  const time = now - ago * minute;
  const today = dayStart( now );

  if ( time >= today ) return 'Today';
  if ( time >= today - 864e5 ) return 'Yesterday';

  return longDate.format( time );
}

function stateLabel( value ) { return { waiting: 'Waiting on you', active: 'Active', quiet: 'Quiet' }[ value ]; }

function latestOf( id )
{
  const event = events.find( ( item ) => item.project === id );

  return event ? event.text + ' · ' + when( event.ago ) : 'Nothing yet';
}

function seeds() { return Object.entries( threads ).filter( ( [ , thread ] ) => thread.project === null ).sort( ( a, b ) => a[ 1 ].ago - b[ 1 ].ago ); }
function waitingNotices() { return notices.filter( ( item ) => item.kind === 'waiting' ); }
function projectsByRecent() { return Object.entries( projects ).sort( ( a, b ) => a[ 1 ].ago - b[ 1 ].ago ); }

// ---- The workspace -------------------------------------------------------------------------------------------------

function renderWorkspace()
{
  const waiting = waitingNotices();
  const forming = seeds();
  const all = projectsByRecent();
  const active = all.filter( ( [ , project ] ) => project.state !== 'quiet' ).length;

  const chatCount = Object.keys( threads ).length;
  let html = '<div class="eyebrow">' + escapeText( longDate.format( now ) ) + '</div><h1>Your Workspace</h1>';

  // With no project yet the workspace is its chats, and says so first.
  const chatsFigure = figure( chatCount, 'Chats', all.length ? forming.length + ' not in a project' : 'Newest: ' + ( forming[ 0 ] ? forming[ 0 ][ 1 ].title : 'none yet' ), 'all-chats', null );
  const projectsFigure = all.length ? figure( all.length, 'Projects', active + ' with work under way', 'projects', null ) : '';
  const waitingFigure = figure( waiting.length, 'Waiting on you', waiting.map( ( item ) => projects[ item.project ].name ).join( ', ' ) || 'Nothing right now', 'noticed', waiting.length ? 'attention' : null );

  html += '<div class="section" style="margin-top:18px"><div class="section-head"><h2>At a glance</h2></div><div class="glance" style="margin-top:0">'
    + ( all.length ? projectsFigure + waitingFigure + chatsFigure : chatsFigure + waitingFigure )
    + '</div></div>';

  if ( state.undo )
    html += '<div class="section"><div class="notice arrive"><div class="notice-text">' + escapeText( state.undo.text ) + '</div><div class="notice-actions"><button type="button" class="button quiet" data-do="undo">Undo</button></div></div></div>';

  if ( notices.length )
  {
    html += '<div class="section" id="noticed"><div class="section-head"><h2>Needs you, and what Mila noticed</h2></div><div class="notices">';

    for ( const notice of notices )
      html += renderNotice( notice );

    html += '</div></div>';
  }

  if ( all.length )
  {
    html += '<div class="section" id="recent-projects"><div class="section-head"><h2>Recent projects</h2><button type="button" class="link" data-do="all-projects">All ' + all.length + ' projects</button></div><div class="projects">';

    for ( const [ id, project ] of all.slice( 0, 3 ) )
      html += renderProjectCard( id, project );

    html += '</div></div>';
  }

  const proposal = notices.find( ( item ) => item.kind === 'proposal' );
  const related = proposal ? proposal.threads : [];
  const note = all.length ? 'Not in a project' : 'Each one stands on its own';

  html += '<div class="section" id="chats"><div class="section-head"><h2>Chats</h2><span class="section-note">' + note + ' · <button type="button" class="link" data-do="all-chats">All ' + chatCount + ' chats</button></span></div>';

  if ( forming.length )
  {
    html += '<div class="rows">';

    for ( const [ id, thread ] of forming.slice( 0, 5 ) )
      html += chatRow( id, thread, related.includes( id ), false );

    html += '</div>';
  }
  else
  {
    html += '<div class="rows"><div class="empty">Every chat is in a project. Start a new one below.</div></div>';
  }

  html += '</div>';

  return html;
}

/** A chat as a row: its title, the start of Mila's last reply, where it is, and when. */
function chatRow( id, thread, related, withProject )
{
  const lastReply = thread.messages ? [ ...thread.messages ].reverse().find( ( message ) => message.who === 'mila' ) : null;
  const preview = lastReply ? plainText( lastReply.html ) : thread.reply;
  const where = withProject ? ( thread.project ? projects[ thread.project ].name + ' · ' : 'No project · ' ) : '';
  const mark = related ? '<span class="related-mark" title="Mila sees this as part of a bigger topic"></span>' : '';

  return '<button type="button" class="row chat-row' + ( state.arriving === id ? ' arrive' : '' ) + '" data-do="open-thread" data-id="' + id + '" data-seed="' + id + '">'
    + '<span class="row-main"><div class="row-title">' + mark + escapeText( thread.title ) + '</div><div class="row-sub chat-preview">' + escapeText( where ) + escapeText( preview || 'New chat' ) + '</div></span>'
    + '<span class="row-when">' + when( thread.ago ) + '</span></button>';
}

function figure( value, label, note, target, modifier )
{
  const action = target === 'projects' ? 'all-projects' : target === 'all-chats' ? 'all-chats' : 'section';

  return '<button type="button" class="figure' + ( modifier ? ' ' + modifier : '' ) + '" data-do="' + action + '" data-id="' + target + '">'
    + '<span class="figure-value">' + value + '</span><span class="figure-label">' + escapeText( label ) + '</span><span class="figure-note">' + escapeText( note ) + '</span></button>';
}

function renderNotice( notice )
{
  if ( notice.kind === 'proposal' )
  {
    const joined = notice.threads.map( ( id ) => '<div class="joined">' + escapeText( threads[ id ].title ) + '</div>' ).join( '' );

    return '<div class="notice proposal"><div class="notice-kind">' + markSvg.replace( 'aria-hidden', 'width="13" height="13" aria-hidden' ) + 'Mila noticed</div>'
      + '<div class="notice-text">' + escapeText( notice.text ) + '</div>'
      + '<div class="proposal-body"><div><label class="label" for="proposal-name">Project name</label><input id="proposal-name" class="proposal-name" value="' + escapeText( notice.name ) + '"><div class="notice-text" style="margin-top:6px;font-size:13px">' + escapeText( notice.purpose ) + '</div></div>'
      + '<div class="proposal-threads"><span class="label">Would gather</span>' + joined + '</div></div>'
      + '<div class="notice-actions"><button type="button" class="button primary" data-do="make-project" data-id="' + notice.id + '">Make the project</button><button type="button" class="button quiet" data-do="dismiss" data-id="' + notice.id + '">Not now</button></div></div>';
  }

  const kind = notice.kind === 'waiting' ? 'Needs you' : 'Changed';
  const action = notice.kind === 'changed'
    ? '<button type="button" class="button" data-do="open-made" data-id="' + notice.made + '">' + escapeText( notice.action ) + '</button>'
    : '<button type="button" class="button" data-do="continue" data-id="' + notice.thread + '">' + escapeText( notice.action ) + '</button>';

  return '<div class="notice ' + notice.kind + '"><div class="notice-kind">' + kind + ' · ' + escapeText( projects[ notice.project ].name ) + '</div><div class="notice-title">' + escapeText( notice.title ) + '</div>'
    + '<div class="notice-text">' + escapeText( notice.text ) + '</div><div class="notice-actions">' + action + '</div></div>';
}

function renderProjectCard( id, project )
{
  const max = Math.max( 1, ...project.pulse );
  const bars = project.pulse.map( ( value ) => '<i style="height:' + Math.round( 100 * value / max ) + '%"></i>' ).join( '' );
  const counts = project.threads.length + ' chats · ' + project.made.length + ' made';

  return '<button type="button" class="project-card' + ( state.arriving === id ? ' arrive' : '' ) + '" data-do="open-project" data-id="' + id + '" data-card="' + id + '">'
    + '<div class="project-top"><div><div class="project-name">' + escapeText( project.name ) + '</div><div class="project-purpose">' + escapeText( project.purpose ) + '</div></div>'
    + '<span class="state ' + project.state + '">' + stateLabel( project.state ) + '</span></div>'
    + '<div class="pulse" aria-label="Activity over the last two weeks">' + bars + '</div>'
    + '<div class="project-foot"><span class="project-latest">' + escapeText( latestOf( id ) ) + '</span><span class="counts">' + counts + '</span></div></button>';
}

function renderFile( id, item, withProject )
{
  const where = ( withProject ? projects[ item.project ].name + ' · ' : '' ) + when( item.ago );
  const changed = item.changed ? '<span class="changed"> · changed since</span>' : '';

  return '<button type="button" class="file" data-do="open-made" data-id="' + id + '"><span class="file-name">' + escapeText( item.name ) + '</span><span class="file-where">' + escapeText( where ) + changed + '</span></button>';
}

// ---- All projects ---------------------------------------------------------------------------------------------------

function shownProjects()
{
  const query = state.projectsQuery.toLowerCase();
  let list = Object.entries( projects ).filter( ( [ , project ] ) =>
    ( state.projectsFilter === 'all' || project.state === state.projectsFilter )
    && ( !query || project.name.toLowerCase().includes( query ) || project.purpose.toLowerCase().includes( query ) ) );

  list.sort( state.projectsSort === 'name' ? ( a, b ) => a[ 1 ].name.localeCompare( b[ 1 ].name ) : ( a, b ) => a[ 1 ].ago - b[ 1 ].ago );

  return list;
}

function renderProjectsTable()
{
  const list = shownProjects();
  let rows = '<div class="table-row table-head"><span>Project</span><span>State</span><span class="cell-latest">Latest</span><span class="cell-counts">Contents</span></div>';

  for ( const [ id, project ] of list )
    rows += '<button type="button" class="table-row" data-do="open-project" data-id="' + id + '"><span style="min-width:0"><div class="cell-name">' + escapeText( project.name ) + '</div><div class="cell-sub">' + escapeText( project.purpose ) + '</div></span>'
      + '<span><span class="state ' + project.state + '">' + stateLabel( project.state ) + '</span></span><span class="cell-latest">' + escapeText( latestOf( id ) ) + '</span>'
      + '<span class="cell-counts">' + project.threads.length + ' chats<br>' + project.made.length + ' made</span></button>';

  if ( list.length === 0 )
    rows += '<div class="empty">No project matches. Ask Mila to start one.</div>';

  return rows;
}

function renderProjects()
{
  const filters = [ [ 'all', 'All' ], [ 'waiting', 'Waiting on you' ], [ 'active', 'Active' ], [ 'quiet', 'Quiet' ] ];
  let html = '<div class="eyebrow">Your Workspace</div><h1>All projects</h1><p class="lead">Every project in your workspace. Choose one to open it, or ask Mila to find it.</p><div class="tools">'
    + '<label for="project-search" hidden>Search projects</label><input id="project-search" class="search" placeholder="Search projects" value="' + escapeText( state.projectsQuery ) + '" autocomplete="off">';

  for ( const [ value, label ] of filters )
    html += '<button type="button" class="filter" data-do="projects-filter" data-value="' + value + '" aria-pressed="' + ( state.projectsFilter === value ) + '">' + label + '</button>';

  html += '<label for="project-sort" hidden>Sort</label><select id="project-sort" class="sort"><option value="recent"' + ( state.projectsSort === 'recent' ? ' selected' : '' ) + '>Most recent</option><option value="name"' + ( state.projectsSort === 'name' ? ' selected' : '' ) + '>By name</option></select></div>';
  html += '<div class="table" id="projects-table">' + renderProjectsTable() + '</div>';

  return html;
}

// ---- All chats, and one chat with the pane to itself ---------------------------------------------------------------

function shownChats()
{
  const query = state.chatsQuery.toLowerCase();

  return Object.entries( threads ).filter( ( [ , thread ] ) =>
    ( state.chatsFilter === 'all' || ( state.chatsFilter === 'loose' ? thread.project === null : thread.project !== null ) )
    && ( !query || thread.title.toLowerCase().includes( query ) || ( thread.reply || '' ).toLowerCase().includes( query ) ) )
    .sort( ( a, b ) => a[ 1 ].ago - b[ 1 ].ago );
}

function renderChatList()
{
  const list = shownChats();

  if ( list.length === 0 )
    return '<div class="empty">No chat matches.</div>';

  return list.map( ( [ id, thread ] ) => chatRow( id, thread, false, Object.keys( projects ).length > 0 ) ).join( '' );
}

function renderChats()
{
  const filters = Object.keys( projects ).length ? [ [ 'all', 'All' ], [ 'loose', 'Not in a project' ], [ 'placed', 'In a project' ] ] : [];
  let html = '<div class="eyebrow">Your Workspace</div><h1>All chats</h1><p class="lead">Every chat, newest first. Choose one to open it, or ask Mila to find it.</p><div class="tools">'
    + '<label for="chat-search" hidden>Search chats</label><input id="chat-search" class="search" placeholder="Search chats" value="' + escapeText( state.chatsQuery ) + '" autocomplete="off">';

  for ( const [ value, label ] of filters )
    html += '<button type="button" class="filter" data-do="chats-filter" data-value="' + value + '" aria-pressed="' + ( state.chatsFilter === value ) + '">' + label + '</button>';

  html += '</div><div class="rows" id="chats-list" style="margin-top:14px">' + renderChatList() + '</div>';

  return html;
}

function chatMessages( id )
{
  const thread = threads[ id ];

  if ( !thread.messages )
  {
    const ending = thread.cut ? '<p class="row-sub">The answer was cut short here.</p>' : '';
    thread.messages = [ { who: 'you', text: thread.title }, { who: 'mila', html: '<p>' + escapeText( thread.reply ) + '</p>' + ending } ];
  }

  return thread.messages;
}

function renderChat( id )
{
  const thread = threads[ id ];
  const where = thread.project
    ? 'In <button type="button" class="link" data-do="open-project" data-id="' + thread.project + '">' + escapeText( projects[ thread.project ].name ) + '</button>'
    : 'Not in a project';

  return '<div class="chat-view"><div class="chat-head"><div class="eyebrow">Chat</div><h1 class="chat-title">' + escapeText( thread.title ) + '</h1>'
    + '<div class="placement chat-placement">' + where + ' · ' + when( thread.ago ) + '</div></div>'
    + '<div class="chat-messages">' + chatMessages( id ).map( renderMessage ).join( '' ) + '</div></div>';
}

// ---- Activity -------------------------------------------------------------------------------------------------------

function renderActivity()
{
  const types = [ [ 'all', 'Everything' ], [ 'decision', 'Decisions' ], [ 'creation', 'Creations' ], [ 'plan', 'Plans' ], [ 'discovery', 'Discoveries' ], [ 'conversation', 'Conversations' ] ];
  let html = '<div class="eyebrow">Your Workspace</div><h1>Activity</h1><p class="lead">Everything that happened across your projects, newest first.</p><div class="tools">';

  for ( const [ value, label ] of types )
    html += '<button type="button" class="filter" data-do="activity-filter" data-value="' + value + '" aria-pressed="' + ( state.activityFilter === value ) + '">' + label + '</button>';

  html += '</div>';

  const exists = ( event ) => ( !event.project || projects[ event.project ] ) && ( event.open[ 0 ] !== 'thread' || threads[ event.open[ 1 ] ] )
    && ( event.open[ 0 ] !== 'made' || projects[ made[ event.open[ 1 ] ].project ] );
  const shown = events.filter( ( event ) => exists( event ) && ( state.activityFilter === 'all' || event.type === state.activityFilter ) ).sort( ( a, b ) => a.ago - b.ago );
  let current = null;

  for ( const event of shown )
  {
    const day = dayLabel( event.ago );

    if ( day !== current )
    {
      html += ( current === null ? '' : '</div></div>' ) + '<div class="day"><h2>' + escapeText( day ) + '</h2><div class="timeline">';
      current = day;
    }

    const where = event.project && projects[ event.project ] ? projects[ event.project ].name : 'Chats';
    html += '<div class="event ' + event.who + '"><span class="event-time">' + escapeText( clock.format( now - event.ago * minute ) ) + '</span>'
      + '<div class="event-text"><button type="button" class="link" data-do="open-' + event.open[ 0 ] + '" data-id="' + event.open[ 1 ] + '">' + escapeText( event.text ) + '</button>'
      + '<div class="event-where">' + ( event.who === 'mila' ? 'Mila' : 'You' ) + ' · ' + escapeText( where ) + '</div></div></div>';
  }

  if ( current !== null )
    html += '</div></div>';

  return html;
}

// ---- A project: its summary first --------------------------------------------------------------------------------

function renderProject( id )
{
  const project = projects[ id ];
  const understanding = project.understanding;
  const nav = [ [ 'threads', 'Chats', project.threads.length ], [ 'made-here', 'Made', project.made.length ], [ 'plans', 'Plans', project.plans.length ],
    [ 'findings', 'Findings', project.findings.length ], [ 'history', 'History', null ] ];

  let html = '<div class="project-view"><nav class="project-nav" aria-label="This project"><div class="nav-title">In this project</div>'
    + '<button type="button" data-do="scroll-to" data-id="overview"><span>Overview</span><span></span></button>';

  for ( const [ anchor, label, count ] of nav )
    html += '<button type="button" data-do="scroll-to" data-id="' + anchor + '"><span>' + label + '</span><span class="nav-count">' + ( count === null ? '' : count ) + '</span></button>';

  html += '</nav><div class="project-main"><div id="overview">';

  html += '<div class="eyebrow">Project</div><h1>' + escapeText( project.name ) + '</h1><p class="lead">' + escapeText( project.purpose ) + '</p>'
    + '<div class="project-meta"><span class="state ' + project.state + '">' + stateLabel( project.state ) + '</span>' + ( project.folder ? '<span class="chip">' + escapeText( project.folder ) + '</span>' : '' )
    + '<span class="row-sub">Latest: ' + escapeText( latestOf( id ) ) + '</span></div>';

  html += '<div class="glance">'
    + figure( project.threads.length, 'Chats', 'In this project', 'threads', null )
    + figure( project.made.length, 'Made', project.made.length ? made[ project.made[ 0 ] ].name : 'Nothing yet', 'made-here', null )
    + figure( project.plans.length, 'Plans', project.plans.length ? 'Stopped at step 3 of 5' : 'None', 'plans', project.state === 'waiting' ? 'attention' : null )
    + figure( project.findings.length, 'Findings', project.findings.length ? 'With their sources' : 'None yet', 'findings', null )
    + '</div>';

  const action = understanding.nextAction
    ? '<div class="next-action"><button type="button" class="button primary" data-do="' + understanding.nextAction[ 0 ] + '" data-id="' + understanding.nextAction[ 1 ] + '">' + escapeText( understanding.nextAction[ 2 ] ) + '</button></div>'
    : '';

  html += '<div class="summary"><div><span class="label">What Mila understands</span><p>' + escapeText( understanding.summary ) + '</p>'
    + ( understanding.questions.length ? '<div style="margin-top:12px"><span class="label">Open questions</span><ul>' + understanding.questions.map( ( q ) => '<li>' + escapeText( q ) + '</li>' ).join( '' ) + '</ul></div>' : '' ) + '</div>'
    + '<div><span class="label">Next</span><p>' + escapeText( understanding.next ) + '</p>' + action + '</div></div></div>';

  html += '<div class="section" id="threads"><div class="section-head"><h2>Chats</h2></div><div class="rows">';

  for ( const threadId of project.threads )
  {
    const thread = threads[ threadId ];
    html += '<button type="button" class="row" data-do="open-thread" data-id="' + threadId + '"><span class="row-main"><div class="row-title">' + escapeText( thread.title ) + '</div><div class="row-sub">' + escapeText( thread.kind ) + '</div></span><span class="row-when">' + when( thread.ago ) + '</span></button>';
  }

  html += '</div></div>';

  if ( project.made.length )
  {
    html += '<div class="section" id="made-here"><div class="section-head"><h2>Made</h2></div><div class="made">';

    for ( const madeId of project.made )
      html += renderFile( madeId, made[ madeId ], false );

    html += '</div></div>';
  }

  if ( project.plans.length )
  {
    html += '<div class="section" id="plans"><div class="section-head"><h2>Plans</h2></div><div class="rows">';

    for ( const planId of project.plans )
    {
      const plan = plans[ planId ];
      const done = plan.steps.filter( ( step ) => step[ 1 ] === 'done' ).length;
      html += '<button type="button" class="row" data-do="open-plan" data-id="' + planId + '"><span class="row-main" style="flex:1"><div class="row-title">' + escapeText( plan.goal ) + '</div><div class="row-sub">' + done + ' of ' + plan.steps.length + ' steps · ' + escapeText( plan.runs[ 0 ].end ) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + ( 100 * done / plan.steps.length ) + '%"></div></div></span><span class="row-when">' + when( plan.runs[ 0 ].ago ) + '</span></button>';
    }

    html += '</div></div>';
  }

  if ( project.findings.length )
  {
    html += '<div class="section" id="findings"><div class="section-head"><h2>Findings</h2></div><div class="rows">';

    for ( const findingId of project.findings )
      html += '<div class="finding"><div>' + escapeText( findings[ findingId ].text ) + '</div><div class="finding-sources">From ' + escapeText( findings[ findingId ].sources ) + '</div></div>';

    html += '</div></div>';
  }

  html += '<div class="section" id="history"><div class="section-head"><h2>History</h2></div><div class="timeline">';

  for ( const event of events.filter( ( item ) => item.project === id ) )
    html += '<div class="event ' + event.who + '"><span class="event-time">' + escapeText( when( event.ago ) ) + '</span><div class="event-text"><button type="button" class="link" data-do="open-' + event.open[ 0 ] + '" data-id="' + event.open[ 1 ] + '">' + escapeText( event.text ) + '</button><div class="event-where">' + ( event.who === 'mila' ? 'Mila' : 'You' ) + '</div></div></div>';

  html += '</div></div></div></div>';

  return html;
}

// ---- Rendering ------------------------------------------------------------------------------------------------------

const icon = ( body ) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
const icons = {

const shortcut = /Mac|iPhone|iPad/.test( navigator.platform || navigator.userAgent ) ? '⌘K' : 'Ctrl K';

function sideItem( action, id, label, iconName, current, trailing )

/** The sidebar: always the same places, and the project or chat you are in marked among them. */
function renderSide()
{
  const view = state.view;
  const all = projectsByRecent();
  const chatCount = Object.keys( threads ).length;
  const count = ( value ) => '<span class="side-count">' + value + '</span>';

  let html = '<button type="button" class="side-workspace" data-do="workspace"><span class="side-mark">' + markSvg + '</span>'
    + '<span class="side-name"><b>Your Workspace</b><span>Mila Assistant</span></span></button>';

  html += sideItem( 'palette', null, 'Search', 'search', false, '<kbd>' + shortcut + '</kbd>' );
  html += '<div class="side-rule"></div>';
  html += sideItem( 'workspace', null, 'Workspace', 'workspace', view === 'workspace' );
  html += sideItem( 'all-projects', null, 'Projects', 'projects', view === 'projects', count( all.length ) );
  html += sideItem( 'all-chats', null, 'Chats', 'chats', view === 'chats', count( chatCount ) );

  if ( all.length )

    html += sideItem( 'new-project', null, 'New project', 'plus', false ).replace( 'class="side-item"', 'class="side-item side-quiet"' );
  }

  const recent = Object.entries( threads ).sort( ( a, b ) => a[ 1 ].ago - b[ 1 ].ago ).slice( 0, 4 );
  html += '<div class="side-title"><span>Recent chats</span></div>';

  for ( const [ id, thread ] of recent )
    html += sideItem( 'open-thread', id, escapeText( thread.title ), null, view === 'chat' && state.chat === id ).replace( '<span class="side-label">', '<span class="side-dot" style="background:transparent;border:1.5px solid var(--ink-3)"></span><span class="side-label">' );

  html += '<div class="side-foot">' + sideItem( 'settings', null, 'Settings', 'settings', false )
    + '<button type="button" class="side-item side-model" data-do="model" aria-haspopup="dialog"><span class="dot"></span><span class="side-label">Gemma 4 12B</span><span>Model</span></button>'
    + '<button type="button" class="side-user" data-do="user-menu" aria-haspopup="menu"><span class="avatar">TT</span><span class="side-name"><b>Todd Thomson</b><span>Workspace owner</span></span><span class="side-chevrons">' + icons.chevrons + '</span></button></div>';

  document.getElementById( 'side' ).innerHTML = html;

function renderCrumbs()
{
  const home = icons.workspace + '<button type="button" data-do="workspace">Your Workspace</button><span>/</span>';
  const here = ( text ) => '<span class="here">' + escapeText( text ) + '</span>';

  if ( state.view === 'project' ) return home + '<button type="button" data-do="all-projects">Projects</button><span>/</span>' + here( projects[ state.project ].name );
  if ( state.view === 'projects' ) return home + here( 'Projects' );
  if ( state.view === 'chats' ) return home + here( 'Chats' );
  if ( state.view === 'activity' ) return home + here( 'Activity' );

  if ( state.view === 'chat' )
  {
    const thread = threads[ state.chat ];
    const place = thread.project
      ? '<button type="button" data-do="open-project" data-id="' + thread.project + '">' + escapeText( projects[ thread.project ].name ) + '</button><span>/</span>'
      : '<button type="button" data-do="all-chats">Chats</button><span>/</span>';

    return home + place + here( thread.title );
  }

  return icons.workspace + here( 'Your Workspace' );
}

let lastView = null;

function render()
{
  const view = document.getElementById( 'view' );
  const key = state.view + ':' + state.project + ':' + state.chat;
  const main = document.getElementById( 'main' );

  if ( state.view === 'activity' ) view.innerHTML = renderActivity();
  else if ( state.view === 'projects' ) view.innerHTML = renderProjects();
  else if ( state.view === 'project' ) view.innerHTML = renderProject( state.project );
  else if ( state.view === 'chats' ) view.innerHTML = renderChats();
  else if ( state.view === 'chat' ) view.innerHTML = renderChat( state.chat );
  else view.innerHTML = renderWorkspace();

  if ( key !== lastView )
  {
    view.classList.remove( 'view-enter' );
    void view.offsetWidth;
    view.classList.add( 'view-enter' );
    main.scrollTop = 0;
    lastView = key;
  }

  // A chat reads to its latest turn.
  if ( state.view === 'chat' )
    main.scrollTop = main.scrollHeight;

  document.getElementById( 'crumbs' ).innerHTML = renderCrumbs();
  renderSide();

  wireProjectTools();
  renderDock();
  state.arriving = null;
}

function wireProjectTools()
{
