name: Publish Mila Site

# Publishes mila.toddt.me: the Hugo site + Doxygen API reference -> GitHub Pages, from `dev`.
#
# MANUAL ONLY, deliberately. Site changes accumulate on `dev` across as many commits as they
# need, and publishing is a separate decision taken by running this workflow. An earlier version
# auto-published on any push touching `Web/**`, which was wrong in both directions: it shipped
# work that was not ready, and it stayed silent for two weeks while a Doxygen break in `Mila/Src`
# blocked every run, because source paths deliberately do not trigger it. Doc-comment drift is a
# source problem and belongs to a source check, not to the publish button.
#
# The validate step gates the deploy: a broken build or malformed structured data fails the
# build job, and the deploy job never runs.
#
# The API reference is folded into the SAME Pages artifact -- a Pages deployment replaces the
# whole site, so publishing the authored site alone would delete /api from it. They therefore
# deploy together and /api tracks `dev`, which is what you want for a reference generated from
# the source. It is indexed. (web.yml, "Mila Web", is the faster site-only build+validate gate
# that runs automatically on site changes; it never deploys.)
#
# The build runs Doxygen directly against the canonical Mila/Docs/Doxyfile -- no CMake
# configure, no CUDA toolkit, no Graphviz (the docs describe the source; they compile
# nothing and dot graphs are disabled, see the Doxyfile). Doxygen is pinned to 1.17
# (matches local validation and the C++23 module .ixx parsing).
#
# Deployment uses GitHub's first-party Pages actions (upload-pages-artifact +
# deploy-pages), NOT a gh-pages branch push. This is deliberate: the branch-push approach
# runs git inside the runner and fails there ("not in a git directory"), which is exactly
# what froze the published docs. deploy-pages never touches git in the workspace -- it
# hands the uploaded artifact to the Pages API. Requires the repo Pages "Source" set to
# "GitHub Actions" (not "Deploy from a branch"), and the `github-pages` environment's
# deployment branch policy to permit `dev`.

on:
  # There is no push trigger. Running this workflow IS the decision to publish, and the deploy
  # replaces the live site wholesale. To build and inspect without publishing, use "Mila Web"
  # (web.yml), which runs the same Hugo build and the same validation and never deploys.
  workflow_dispatch:

# Pages deployment needs write to Pages and an OIDC token to prove the deploy
# originates from this workflow; the build only reads the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments and let an in-flight one finish (cancelling a
# production deploy mid-publish can leave the site half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Doxygen (build artifact)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Pin Doxygen to 1.17: the distro package lags, and 1.17 is what the docs config
      # and the C++23 module (.ixx) parsing were validated against.
      - name: Install Doxygen 1.17.0
        run: |
          wget -q https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz
          tar -xzf doxygen-1.17.0.linux.bin.tar.gz
          sudo cp doxygen-1.17.0/bin/doxygen /usr/local/bin/
          doxygen --version

      # Runs from the repo root; the Doxyfile's paths are repo-root-relative. WARN_AS_ERROR
      # in the Doxyfile fails this step on any doc warning (the anti-rot ratchet), which
      # gates the deploy job below -- a warning stops the republish, it does not break the
      # already-published site.
      - name: Generate documentation
        run: |
          mkdir -p build/docs   # Doxygen does not create nested OUTPUT_DIRECTORY parents
          doxygen Mila/Docs/Doxyfile

      # Hugo builds the authored site (landing page + writeups). Pinned like Doxygen above:
      # the site must not change shape because a runner picked up a new release.
      #
      # Standard edition, deliberately. The extended edition only adds WebP encoding, Sass
      # transpilation, and cloud-bucket deployment -- the site uses none of them (its CSS is
      # written inline in layouts/_default/baseof.html), and extended would pull a Dart Sass
      # prerequisite for nothing.
      - name: Install Hugo 0.164.0
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_0.164.0_linux-amd64.tar.gz
          tar -xzf hugo_0.164.0_linux-amd64.tar.gz hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      # --destination is resolved relative to --source, hence the ../ climb back to the
      # repo root. --minify strips whitespace; --gc drops stale cache entries.
      - name: Build site
        run: hugo --source Web --destination ../build/site --minify --gc

      # The API reference is folded in as a subtree. The Doxyfile is untouched -- its output
      # is relocated here, which keeps this reversible.
      - name: Fold in the API reference
        run: |
          mkdir -p build/site/api
          cp -r build/docs/html/* build/site/api/

      # The API reference is indexable. It was marked noindex on the theory that thin generated
      # HTML would dilute the site; the predecessor corpus on gh-pages had in fact been indexed
      # and held first-position results, as an aggregate body of pages rather than through any
      # single one. That is measured evidence against the theory, so the noindex step is gone.
      # Discovery is via the nav link present on every page (hugo.toml params.nav) plus Doxygen's
      # own dense internal linking; the pages are absent from sitemap.xml because Hugo generates
      # it before the Doxygen tree is folded in, which slows discovery but does not prevent it.

      # Fail loudly rather than publishing a broken site: the deploy below replaces the live
      # site wholesale, and there is no staging environment to catch this later.
      - name: Verify the assembled site
        run: |
          set -e
          for f in build/site/index.html build/site/blog/index.html \
                   build/site/api/index.html build/site/sitemap.xml; do
            test -s "$f" || { echo "MISSING OR EMPTY: $f"; exit 1; }
          done
          ! grep -q 'noindex' build/site/api/index.html \
            || { echo "api/index.html is marked noindex; it is meant to be indexed"; exit 1; }
          grep -q 'mila.toddt.me/blog/' build/site/sitemap.xml \
            || { echo "sitemap does not list the blog section"; exit 1; }
          echo "--- assembled tree ---"
          find build/site -maxdepth 2 -not -path '*/api/*' | sort

      # Structured-data validation. A bare hugo build exits 0 on JSON-LD that is malformed as
      # structured data (e.g. double-encoded into a JSON string, which crawlers reject as
      # "Invalid top level element string"). Parse every emitted ld+json block on the authored
      # pages and require the top-level element to be a JSON object. This gates the deploy below.
      # (web.yml runs the identical check on pull requests; publish-site.yml repeats it so the deploy is
      # self-gating regardless of what ran upstream.) The /api/ subtree is Doxygen HTML with no
      # structured data, so it is skipped.
      - name: Validate JSON-LD structured data
        run: |
          python3 - <<'PY'
          import re, json, sys, pathlib
          root = pathlib.Path("build/site")
          bad = []
          checked = 0
          for html in root.rglob("index.html"):
              if "/api/" in html.as_posix():
                  continue
              text = html.read_text(encoding="utf-8")
              for block in re.findall(r'<script type="?application/ld\+json"?>(.*?)</script>', text, re.S):
                  checked += 1
                  try:
                      value = json.loads(block)
                  except json.JSONDecodeError as e:
                      bad.append(f"{html}: not valid JSON ({e})")
                      continue
                  if not isinstance(value, dict):
                      bad.append(f"{html}: top-level element is {type(value).__name__}, expected object")
          if bad:
              print("Invalid JSON-LD:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print(f"OK: {checked} JSON-LD block(s) validated as objects")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # No condition: the workflow is manual-only, so reaching here means publishing was asked for.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
