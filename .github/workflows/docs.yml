name: Mila Docs

# Doxygen API docs -> GitHub Pages. Master-only: docs are a release-surface concern,
# not something to regenerate on every dev push or PR.
#
# Deployment uses GitHub's first-party Pages actions (upload-pages-artifact +
# deploy-pages), NOT a gh-pages branch push. This is deliberate: the branch-push
# approach runs git inside the build container and fails there ("not in a git
# directory"), which is exactly what froze the published docs. deploy-pages never
# touches git in the workspace -- it hands the uploaded artifact to the Pages API --
# so the container is a non-issue. Requires the repo Pages "Source" set to
# "GitHub Actions" (not "Deploy from a branch").
#
# Two jobs by necessity: the build MUST run in the CUDA container (CMake's configure
# requires the toolkit even for a docs-only target), while deploy-pages needs no
# toolchain at all and runs on the bare host.

on:
  push:
    branches: [master]
  # Manual re-publish (e.g. refresh the site without a code change, or re-run after a
  # transient deploy failure). Available once this workflow is on the default branch.
  workflow_dispatch:

# Pages deployment needs write to Pages and an OIDC token to prove the deploy
# originates from this workflow; the build only reads the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments and let an in-flight one finish (cancelling a
# production deploy mid-publish can leave the site half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Doxygen (build artifact)
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.3.0-devel-ubuntu26.04
    env:
      CUDA_PATH: /usr/local/cuda
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-

      # python3 is required by CUTLASS's configure (root pulls CUTLASS whenever CUDA
      # is enabled, even for a docs-only configure); the bare CUDA image ships none.
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git wget ca-certificates ninja-build \
            gcc-15 g++-15 clang-21 doxygen graphviz python3 python3-dev

      - name: Install CMake 4.2.3
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-linux-x86_64.tar.gz
          tar -xzf cmake-4.2.3-linux-x86_64.tar.gz
          cp -r cmake-4.2.3-linux-x86_64/bin/* /usr/local/bin/
          cp -r cmake-4.2.3-linux-x86_64/share/* /usr/local/share/

      # Configure only -- the 'docs' target runs Doxygen over README + Mila/Src and
      # compiles nothing. Configure still needs the CUDA toolkit (root requires it);
      # samples/profiling are off to keep it lean.
      - name: Configure (docs)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_CUDA_COMPILER=${CUDA_PATH}/bin/nvcc \
            -DCUDAToolkit_ROOT=${CUDA_PATH} \
            -DCMAKE_CUDA_FLAGS="--allow-unsupported-compiler -ccbin=gcc-15" \
            -DMILA_ENABLE_DOCS=ON \
            -DMILA_ENABLE_SAMPLES=OFF \
            -DMILA_ENABLE_PROFILING=OFF

      - name: Generate documentation
        run: cmake --build build --target docs

      # Doxygen HTML lands in build/docs/html (OUTPUT_DIRECTORY=build/docs, default
      # HTML_OUTPUT=html). Packaged here as the Pages artifact for the deploy job.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
