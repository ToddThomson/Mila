name: Mila Desktop

# The Mila desktop app (Mila/Apps/Desktop/, ChatDesktop.md): the page's and the window's tests on
# every change to them. Its own workflow because it shares nothing with the C++ build -- no CMake,
# no CUDA, minutes not an hour -- and because build-pipeline.yml's triggers (contributor PRs and the
# release merge) would leave a change to the window untested on the `dev` push that makes it.
#
# No installer is built here: the installer carries the session process and its CUDA libraries
# (ChatDesktop.md 9.4), which come from the C++ build. Signing and where it ships are section 9.

on:
  push:
    paths:
      - 'Mila/Apps/Desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'Mila/Apps/Desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  tests:
    name: Page and window tests (node --test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No npm ci: both suites use Node alone (ChatDesktop.md section 5), and the window's drives
      # the mock session over stdio without starting Electron.
      - name: Page tests
        working-directory: Mila/Apps/Desktop/Ui
        run: node --test

      - name: Window tests
        working-directory: Mila/Apps/Desktop/Window
        run: node --test
