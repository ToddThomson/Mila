name: Mila CI

# Purpose: protect what MSVC-local development structurally cannot see --
# cross-compiler portability (clang on Linux), clean-room dependency hygiene, and
# packaging consumability. GPU correctness tests are NOT run here: hosted runners
# have no GPU, so device tests would be theater. Those run locally on real hardware.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# Supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-gate:
    name: Compile (clang-21) + packaging gates
    runs-on: ubuntu-24.04
    # Mirrors the validated WSL toolchain: Ubuntu 26.04 + CUDA 13.3 (glibc 2.43 --
    # the path that broke under CUDA 13.0). No cuDNN variant exists for 26.04, and
    # none is needed while USE_CUDNN is unset, so the plain devel image is correct.
    container: nvidia/cuda:13.3.0-devel-ubuntu26.04
    env:
      CUDA_PATH: /usr/local/cuda
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5

      # Cache CPM dependency clones (cutlass is large and slow to re-clone).
      - name: Cache CPM sources
        uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-

      # ccache persists compiled .cu objects across runs, so the kernel codegen (the
      # bulk of the build, and of the packaging fetchcontent rebuild on master) becomes
      # a cache hit after the first run. Scoped to CUDA only: ccache's support for the
      # C++23 module units is unreliable, so the C++ launcher is intentionally not set.
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # clang-21 compiles the C++23 module units; gcc-15 is only the nvcc host
      # compiler for the (module-free) .cu files. Both ship with Ubuntu 26.04.
      # python3 is required by CUTLASS's configure (find_package(Python3 REQUIRED));
      # the bare CUDA devel image ships none. ccache caches the .cu compiles.
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git wget ca-certificates ninja-build ccache \
            gcc-15 g++-15 clang-21 python3 python3-dev

      - name: Install CMake 4.2.3
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-linux-x86_64.tar.gz
          tar -xzf cmake-4.2.3-linux-x86_64.tar.gz
          cp -r cmake-4.2.3-linux-x86_64/bin/* /usr/local/bin/
          cp -r cmake-4.2.3-linux-x86_64/share/* /usr/local/share/

      # CMAKE_CUDA_ARCHITECTURES is pinned to a single arch (86): CI never RUNS kernels
      # (no GPU), it only needs them to compile, so building the repo default (native;86 =
      # two targets) just doubles codegen for no gain.
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_CUDA_COMPILER=${CUDA_PATH}/bin/nvcc \
            -DCUDAToolkit_ROOT=${CUDA_PATH} \
            -DCMAKE_CUDA_HOST_COMPILER=gcc-15 \
            -DCMAKE_CUDA_FLAGS="--allow-unsupported-compiler" \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DMILA_ENABLE_TESTING=ON \
            -DMILA_ENABLE_PACKAGING_TEST=ON

      # Compiling lib + tests + samples under clang IS the cross-compiler portability
      # check. MSVC silently resolves includes/conformance that clang rejects. Runs on
      # every push/PR -- this is the fast feedback that matters on dev.
      - name: Build
        # -k 0: keep going after the first error so one run surfaces the full
        # clang-portability error list (the gate fails one file at a time otherwise,
        # and each round trip is ~25 min). -j caps parallelism at the runner width.
        run: cmake --build build -- -k 0 -j $(nproc)

      # GPU-free by construction: the gates install Mila and build consumers against it
      # (find_package) and embed it as a subproject (FetchContent). No device used.
      #
      # HEAVY (~26 min: install + consumer module recompile + full in-tree subproject
      # rebuild of every kernel) and they only catch regressions from build-system
      # changes, which land at releases. So they run ONLY on master-bound runs -- the
      # dev -> master release PR and pushes to master -- not on every dev iteration.
      # A packaging regression introduced on dev is caught at the release PR (the suspect
      # set is the batch's CMake-touching commits), before anything is tagged.
      - name: Packaging gates
        if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
        run: ctest --test-dir build -L packaging --output-on-failure
