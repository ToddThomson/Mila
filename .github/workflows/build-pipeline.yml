name: Mila CI

# Purpose: protect what MSVC-local development structurally cannot see --
# cross-compiler portability (clang on Linux), clean-room dependency hygiene, and
# packaging consumability. Two surfaces: compile-and-gate COMPILES the whole tree
# (lib + tests + samples) under clang with CUDA on -- the portability check; and
# cpu-only-tests RUNS the CPU unit suite (MILA_ENABLE_CUDA=OFF) -- the anti-rot
# ratchet. GPU correctness tests are NOT run: hosted runners have no GPU, so device
# tests would be theater. Those run locally on real hardware.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# Supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-gate:
    name: Compile (clang-21) + packaging gates
    runs-on: ubuntu-24.04
    # Mirrors the validated WSL toolchain: Ubuntu 26.04 + CUDA 13.3 (glibc 2.43 --
    # the path that broke under CUDA 13.0). No cuDNN variant exists for 26.04, and
    # none is needed while USE_CUDNN is unset, so the plain devel image is correct.
    container: nvidia/cuda:13.3.0-devel-ubuntu26.04
    env:
      CUDA_PATH: /usr/local/cuda
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5

      # Cache CPM dependency clones (cutlass is large and slow to re-clone).
      - name: Cache CPM sources
        uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-

      # ccache persists compiled .cu objects across runs, so the kernel codegen (the
      # bulk of the build, and of the packaging fetchcontent rebuild on master) becomes
      # a cache hit after the first run. Scoped to CUDA only: ccache's support for the
      # C++23 module units is unreliable, so the C++ launcher is intentionally not set.
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # clang-21 compiles the C++23 module units; gcc-15 is only the nvcc host
      # compiler for the (module-free) .cu files. Both ship with Ubuntu 26.04.
      # python3 is required by CUTLASS's configure (find_package(Python3 REQUIRED));
      # the bare CUDA devel image ships none. ccache caches the .cu compiles.
      # libssl-dev is curl's: on Linux the vendored libcurl takes TLS from the system
      # OpenSSL (CURL_USE_SCHANNEL is Windows-only), so its find_package(OpenSSL) is
      # REQUIRED here and the CUDA devel image ships no headers for it.
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git wget ca-certificates ninja-build ccache \
            gcc-15 g++-15 clang-21 python3 python3-dev libssl-dev

      - name: Install CMake 4.2.3
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-linux-x86_64.tar.gz
          tar -xzf cmake-4.2.3-linux-x86_64.tar.gz
          cp -r cmake-4.2.3-linux-x86_64/bin/* /usr/local/bin/
          cp -r cmake-4.2.3-linux-x86_64/share/* /usr/local/share/

      # CMAKE_CUDA_ARCHITECTURES is pinned to a single arch (86): CI never RUNS kernels
      # (no GPU), it only needs them to compile, so building the repo default (native;86 =
      # two targets) just doubles codegen for no gain.
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_CUDA_COMPILER=${CUDA_PATH}/bin/nvcc \
            -DCUDAToolkit_ROOT=${CUDA_PATH} \
            -DCMAKE_CUDA_HOST_COMPILER=gcc-15 \
            -DCMAKE_CUDA_FLAGS="--allow-unsupported-compiler" \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DMILA_ENABLE_TESTING=ON \
            -DMILA_ENABLE_PACKAGING_TEST=ON

      # Compiling lib + tests + samples under clang IS the cross-compiler portability
      # check. MSVC silently resolves includes/conformance that clang rejects. Runs on
      # every push/PR -- this is the fast feedback that matters on dev.
      - name: Build
        # -k 0: keep going after the first error so one run surfaces the full
        # clang-portability error list (the gate fails one file at a time otherwise,
        # and each round trip is ~25 min). -j caps parallelism at the runner width.
        run: cmake --build build -- -k 0 -j $(nproc)

      # GPU-free by construction: the gates install Mila and build consumers against it
      # (find_package) and embed it as a subproject (FetchContent). No device used.
      #
      # HEAVY (~26 min: install + consumer module recompile + full in-tree subproject
      # rebuild of every kernel) and they only catch regressions from build-system
      # changes, which land at releases. So they run ONLY on master-bound runs -- the
      # dev -> master release PR and pushes to master -- not on every dev iteration.
      # A packaging regression introduced on dev is caught at the release PR (the suspect
      # set is the batch's CMake-touching commits), before anything is tagged.
      - name: Packaging gates
        if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
        run: ctest --test-dir build -L packaging --output-on-failure

  cpu-only-tests:
    name: CPU-only suite (clang-21, MILA_ENABLE_CUDA=OFF)
    # The only CI job that RUNS tests. The CPU-only build needs no GPU, so the CPU
    # unit suite executes here on every push/PR -- the anti-rot ratchet that keeps
    # the revived tests green (compile-and-gate above only COMPILES; device tests
    # stay local). GPU- and data-dependent cases self-skip (GTEST_SKIP), so the
    # absence of a GPU or model weights is green, not red.
    #
    # Plain ubuntu:26.04 (clang-21 + gcc-15 ship with it) -- NOT the CUDA image:
    # MILA_ENABLE_CUDA=OFF leaves the CUDA language disabled (project() declares only
    # CXX; enable_language(CUDA) is gated), so there is no nvcc, no multi-GB CUDA
    # image pull, and no CUTLASS fetch. Mirrors the linux-clang-cpu-release preset.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-cpu-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-cpu-

      # clang-21 compiles the C++23 module units; no nvcc (CUDA off). git is for CPM's
      # dependency clones (GTest), wget/ca-certificates for the CMake download.
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git wget ca-certificates ninja-build clang-21

      - name: Install CMake 4.2.3
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-linux-x86_64.tar.gz
          tar -xzf cmake-4.2.3-linux-x86_64.tar.gz
          cp -r cmake-4.2.3-linux-x86_64/bin/* /usr/local/bin/
          cp -r cmake-4.2.3-linux-x86_64/share/* /usr/local/share/

      # Mirrors the linux-clang-cpu-release preset (CMakePresets.json). Kept as explicit
      # flags rather than --preset so the job is self-contained and pins clang-21 (the
      # preset uses the generic `clang` name, which is the dev's WSL default but not the
      # runner's).
      #
      # MILA_ENABLE_LIBCURL=OFF is the Linux mila-llm wheel's configuration, which had no
      # Linux coverage anywhere -- the only OFF preset is a Windows Debug build. Taking it
      # here gates the wheel's configuration for free and keeps this image free of
      # libssl-dev, which the vendored curl would otherwise require.
      - name: Configure (CPU-only)
        run: |
          cmake -B build-cpu -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DMILA_ENABLE_CUDA=OFF \
            -DMILA_ENABLE_LIBCURL=OFF \
            -DMILA_ENABLE_TESTING=ON \
            -DMILA_ENABLE_SAMPLES=OFF \
            -DMILA_ENABLE_ADAPTORS=OFF \
            -DMILA_ENABLE_PYTHON_BINDINGS=OFF \
            -DMILA_ENABLE_PROFILING=OFF \
            -DMILA_ENABLE_DOCS=OFF

      # Every test executable ctest will run, not just MilaTests: gtest_discover_tests
      # registers a <target>_NOT_BUILT placeholder that FAILS when the binary is absent,
      # so building a subset and then running the whole suite reports a red that is about
      # the build command, not the code. ChatRichTextTests links no Mila and no CUDA --
      # it is the cheapest surface in the tree and belongs in the CPU-only gate.
      #
      # -k 0: one run surfaces the full clang error list (not one file per ~push).
      - name: Build the test executables
        run: cmake --build build-cpu --target MilaTests ChatRichTextTests -- -k 0 -j $(nproc)

      # The ratchet: a CPU regression fails the build. Skips (GPU/data absent) pass.
      - name: Run CPU test suite
        run: ctest --test-dir build-cpu --output-on-failure
