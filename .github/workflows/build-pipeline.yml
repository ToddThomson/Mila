name: Mila CI

# Purpose: protect what MSVC-local development structurally cannot see --
# cross-compiler portability (clang on Linux), clean-room dependency hygiene, and
# packaging consumability. GPU correctness tests are NOT run here: hosted runners
# have no GPU, so device tests would be theater. Those run locally on real hardware.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# Supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-gate:
    name: Compile (clang-21) + packaging gates
    runs-on: ubuntu-24.04
    # Mirrors the validated WSL toolchain: Ubuntu 26.04 + CUDA 13.3 (glibc 2.43 --
    # the path that broke under CUDA 13.0). No cuDNN variant exists for 26.04, and
    # none is needed while USE_CUDNN is unset, so the plain devel image is correct.
    container: nvidia/cuda:13.3.0-devel-ubuntu26.04
    env:
      CUDA_PATH: /usr/local/cuda
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      # Cache CPM dependency clones (cutlass is large and slow to re-clone).
      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-

      # clang-21 compiles the C++23 module units; gcc-15 is only the nvcc host
      # compiler for the (module-free) .cu files. Both ship with Ubuntu 26.04.
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git wget ca-certificates ninja-build \
            gcc-15 g++-15 clang-21

      - name: Install CMake 4.2.3
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-linux-x86_64.tar.gz
          tar -xzf cmake-4.2.3-linux-x86_64.tar.gz
          cp -r cmake-4.2.3-linux-x86_64/bin/* /usr/local/bin/
          cp -r cmake-4.2.3-linux-x86_64/share/* /usr/local/share/

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_CUDA_COMPILER=${CUDA_PATH}/bin/nvcc \
            -DCUDAToolkit_ROOT=${CUDA_PATH} \
            -DCMAKE_CUDA_FLAGS="--allow-unsupported-compiler -ccbin=gcc-15" \
            -DMILA_ENABLE_TESTING=ON \
            -DMILA_ENABLE_PACKAGING_TEST=ON

      # Compiling lib + tests + samples under clang IS the cross-compiler portability
      # check. MSVC silently resolves includes/conformance that clang rejects.
      - name: Build
        run: cmake --build build -- -j $(nproc)

      # GPU-free by construction: the gates install Mila and build consumers against
      # it (find_package) and embed it as a subproject (FetchContent). No device used.
      - name: Packaging gates
        run: ctest --test-dir build -L packaging --output-on-failure
