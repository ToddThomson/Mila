name: Dependency pins

# Purpose: say when a pinned dependency has fallen behind upstream, which nothing
# otherwise does -- a pin moves only when someone happens to look, and curl sat 21
# months and 11 minor releases behind before anyone did.
#
# This opens an ISSUE, never a pull request, and never fails. That is deliberate:
# CI has no GPU (see build-pipeline.yml), so a CUTLASS bump cannot be validated here
# and a green PR would imply a gate that does not exist. The honest artifact is a
# report a human acts on, with the GPU validation run locally.
#
# The companion check -- does NOTICE.md still describe what the build fetches -- is a
# hard gate in build-pipeline.yml, because that one is deterministic and offline.

on:
  schedule:
    # Mondays, 07:00 UTC. Weekly is the right cadence for something measured in months.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-pins
  cancel-in-progress: true

jobs:
  check-upstream:
    name: Report pins behind upstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Compare pins against upstream releases
        id: check
        env:
          # Authenticated so the six release queries do not meet the 60/hour
          # unauthenticated rate limit on a busy runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/dependencies/check_pins.py --check-upstream | tee report.txt
          if grep -q "BEHIND\|moving branch" report.txt; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Dependency pins behind upstream"
          BODY_FILE=issue.md

          {
            echo "Generated by \`.github/workflows/dependency-pins.yml\` on $(date -u +%Y-%m-%d)."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Advisory. A bump that touches CUDA cannot be validated by CI, which has"
            echo "no GPU -- run the suite locally before landing one. Bump the pin and its"
            echo "NOTICE.md row in the same commit, or the \`notice-gate\` job fails."
          } > "$BODY_FILE"

          # One long-lived issue, edited in place, rather than a new one each week.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title \
                       --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$BODY_FILE"
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Close the tracking issue when everything is current
        if: steps.check.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Dependency pins behind upstream"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title \
                       --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Every pin is current."
          fi
