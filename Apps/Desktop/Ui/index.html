<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Mila Desktop</title>
<link rel="icon" href="mila-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Mila" hidden>
    <button class="quiet-icon" type="button" data-action="show-sidebar" aria-label="Show conversations" title="Show conversations"><span class="icon-holder" data-icon="sidebar"></span></button>
    <button class="quiet-icon" type="button" data-action="new-conversation" aria-label="New conversation" data-shortcut-title="New conversation|N"><span class="icon-holder" data-icon="plus"></span></button>
    <button class="quiet-icon rail-foot" type="button" data-action="open-settings" aria-label="Settings" data-shortcut-title="Settings|,"><span class="icon-holder" data-icon="settings"></span></button>
  </nav>
  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="sidebar-top">
      <div class="brand"><img class="brand-mark" src="mila-mark.svg" alt="" width="80" height="62"><span class="brand-name">Mila</span></div>
      <button class="quiet-icon" type="button" data-action="collapse-sidebar" aria-label="Hide conversations" title="Hide conversations"><span class="icon-holder" data-icon="sidebar"></span></button>
    </div>
    <button class="new-conversation" type="button" data-action="new-conversation"><span class="icon-holder" data-icon="plus"></span><span class="new-conversation-label">New conversation</span><kbd data-shortcut="N"></kbd></button>
    <nav class="conversation-list" aria-label="Conversation history"></nav>
    <div class="sidebar-foot">
      <button class="foot-button" type="button" data-action="open-settings"><span class="icon-holder" data-icon="settings"></span><span class="foot-button-label">Settings</span><kbd data-shortcut=","></kbd></button>
      <div class="development" id="development" hidden></div>
    </div>
  </aside>
  <div class="scrim" data-action="close-overlay"></div>
  <main class="main" id="main">
    <header class="header" id="header"></header>
    <div class="transcript-scroll" id="transcript-scroll">
      <div class="transcript" id="transcript"></div>
    </div>
    <section class="plan-panel" id="plan" aria-label="Plan" hidden></section>
    <section class="log-drawer" id="log-drawer" aria-label="Log" hidden></section>
    <div class="composer-area" id="composer-area"></div>
  </main>
  <dialog class="settings-window" id="settings" aria-label="Settings"></dialog>
</div>
</body>
</html>
