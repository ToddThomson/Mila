<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Mila Chat</title>
<link rel="icon" href="mila-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="sidebar-top">
      <div class="brand"><img class="brand-mark" src="mila-mark.svg" alt="" width="80" height="62"><span class="brand-name">Mila Chat</span></div>
      <button class="quiet-icon" type="button" data-action="collapse-sidebar" aria-label="Hide conversations" title="Hide conversations"><span class="icon-holder" data-icon="sidebar"></span></button>
    </div>
    <button class="new-conversation" type="button" data-action="new-conversation"><span class="icon-holder" data-icon="plus"></span><span class="new-conversation-label">New conversation</span><kbd>Ctrl N</kbd></button>
    <nav class="conversation-list" aria-label="Conversation history"></nav>
    <div class="sidebar-foot">
      <button class="foot-button" type="button" data-action="open-models"><span class="icon-holder" data-icon="models"></span>Models</button>
      <button class="foot-button" type="button" data-action="open-settings"><span class="icon-holder" data-icon="settings"></span>Settings</button>
      <div class="development" id="development" hidden></div>
    </div>
  </aside>
  <div class="scrim" data-action="close-overlay"></div>
  <main class="main" id="main">
    <header class="header" id="header"></header>
    <div class="transcript-scroll" id="transcript-scroll">
      <div class="transcript" id="transcript"></div>
    </div>
    <div class="composer-area" id="composer-area"></div>
    <section class="models-view" id="models" aria-label="Models" hidden></section>
  </main>
  <aside class="settings-panel" id="settings" aria-label="Settings" hidden></aside>
</div>
</body>
</html>
