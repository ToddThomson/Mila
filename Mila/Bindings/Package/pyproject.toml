[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mila-llm"
# PEP 440 mapping of Mila's own scheme. Version.txt is 0.20.0-beta.2+20, where
# beta.2 is the RELEASE being worked toward and +20 is a development build of it:
#
#   0.20.0-beta.2+20  ->  0.20.0b2.dev20   a snapshot, sorts BEFORE the release
#   0.20.0-beta.2     ->  0.20.0b2         the release itself, when it is tagged
#
# The build counter maps to .devN and not to .postN, because post-releases sort
# AFTER: publishing a snapshot as plain 0.20.0b2 would permanently take the release's
# own number, forcing the real beta.2 to ship as a post-release of a snapshot. A
# published version can never be reused, so this is not a mistake that can be undone.
# PyPI rejects local version labels (+20), which is why the counter has to move here.
version = "0.20.0b2.dev20"
description = "The LLM stack you can read and understand: Gemma 4 and Llama on CUDA, built from explicit C++23 components."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Todd Thomson" }]
keywords = ["llm", "cuda", "inference", "gemma", "llama", "transformer"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

# The CUDA runtime libraries the extension links, as NVIDIA's own wheels. This is
# what makes `pip install mila-llm` work on a machine with no CUDA Toolkit, which is
# the entire point of shipping a wheel. Unsuffixed names: the -cu13 spellings are
# deprecated stubs that redirect here. Both publish win_amd64 and manylinux wheels.
# An installed Toolkit still works and is used as the fallback (see mila/__init__.py).
dependencies = [
    "nvidia-cublas>=13.0,<14.0",
    "nvidia-curand>=10.4,<11.0",
]

[project.urls]
Homepage = "https://mila.toddt.me"
Source = "https://github.com/toddthomson/Mila"
Issues = "https://github.com/toddthomson/Mila/issues"

[tool.setuptools]
package-dir = { "" = "src" }
# The compiled extension is produced by the CMake build (target MilaPy) and staged
# into src/mila; it is not built by this backend. Building the wheel is therefore a
# packaging step over an existing build, not a second build system.
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mila = ["_mila*.pyd", "_mila*.so", "py.typed"]
