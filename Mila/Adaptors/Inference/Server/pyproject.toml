[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mila-llm-server"
# Derived from the repository's Version.txt by the CMake build, not written here: the
# binding's hand-maintained copy drifted 18 builds behind before this was fixed, and MIS
# releases with the runtime it serves. The SemVer -> PEP 440 mapping lives once, in
# cmake/MilaVersion.cmake; setup.py reads the generated VERSION file.
dynamic = ["version"]
description = "Mila Inference Server: OpenAI, Anthropic and Mila chat protocols over the Mila runtime."
readme = "README.md"
# Follows mila-llm's range rather than leading it. The old 3.13 floor predated the cp312
# wheels and refused an interpreter the binding supports; the 3.14 ceiling is still real,
# because no mila-llm wheel is built against it.
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Todd Thomson" }]
keywords = ["llm", "inference", "server", "openai", "anthropic", "gemma", "llama"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    # The runtime, as an ordinary dependency rather than a file the build copies in.
    # The floor is the first published release carrying from_store(); a development
    # snapshot satisfies it too, since 0.20.0b3.devN sorts after 0.20.0b2.
    "mila-llm>=0.20.0b2",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
]

[project.scripts]
# The whole command line: serving is configured through MILA_* environment variables
# (or a .env beside the working directory), so there are no flags to parse.
mila-server = "mila_llm_server.app:main"

[project.urls]
Homepage = "https://mila.toddt.me"
Source = "https://github.com/toddthomson/Mila"
Issues = "https://github.com/toddthomson/Mila/issues"

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    # Renders the vendored Gemma 4 reference template (tests/reference/) so the
    # prompt tests can diff against Google's own implementation rather than against
    # our reading of it. Test-only -- MIS builds prompts natively and never runs Jinja
    # at serving time.
    "jinja2>=3.1.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The suite imports mila_llm_server as an installed package, which an src layout
# guarantees is the same code the server runs -- there is no copy in the rootdir for
# an accidental import to find instead.
testpaths = ["tests"]
