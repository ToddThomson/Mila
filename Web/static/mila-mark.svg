<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 79.7 62" width="79.7" height="62">
  <!-- Mila mark.

       a : the Achilles crest, traced from achilles.png (no vector original survives; the fit
           scores 95.3% IoU against the 64px raster). Back leg foot tapered to take off the
           flare, 17 units down to 14, against a body of about 13.

       i : a parallelogram. Top edge at y=21, the apex of the a's internal triangle. Slant
           0.5432 is the a's back leg average slope, which makes the channel between them equal
           at top and foot, 5.70 units at each. It widens to 7.6 mid height because the a's back
           leg bows about 4.3 units left of straight. That bow is deliberate.

       The viewBox is trimmed tight to the ink. The bottom edge IS the mark's baseline, so in a
       lockup `align-items: baseline` lands the mark's feet on the wordmark's baseline exactly.
       Do not pad this box; padding baked into the asset gets paid for twice.

       The inks never overlap, so no clip path is needed.
  -->
  <path fill="#0f9aa8" d="M 43.89,21 L 56.89,21 L 79.70,63 L 66.70,63 Z"/>
  <path fill="#0a40c2" d="M 33,1
     C 12.7,10.7 9.3,20.3 4.5,30
     C 0.4,41 -1.5,52 1.5,63
     C 10.3,49 16,35 25,21
     C 32.7,35 40.3,49 47,63
     L 61,63
     C 46.15,42.3 36.3,21.7 33,1 Z"/>
</svg>
