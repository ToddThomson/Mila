baseURL = 'https://mila.toddt.me/'
locale = 'en-us'
title = 'Mila'

# Mila does not tag or categorise posts, and Hugo would otherwise emit empty /categories/
# and /tags/ pages and list them in the sitemap -- thin pages that dilute the site.
disableKinds = ['taxonomy', 'term']

# Builds with the Hugo STANDARD edition -- no Sass, no image processing, no cloud deploy.
# The site's CSS is inline in layouts/_default/baseof.html. Keep it that way, or the CI pin
# (and the local install) has to move to the extended edition.
#
# The API reference is Doxygen output copied into /api/ by the docs workflow -- it is not
# Hugo content, so it stays out of the sitemap automatically. It is marked noindex by a
# post-processing step in that workflow, which is stronger than a robots.txt rule: robots.txt
# only asks crawlers not to fetch, and a URL linked from elsewhere can still be indexed.
enableRobotsTXT = false

# Writeups are migrated from GitHub Discussions and contain tables and fenced code.
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = true
    style = 'github-dark'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  # No VRAM figure here. "12 GB" describes the development machine, not a capability bound, and
  # stating it reads as a ceiling. Keep this in step with the hero lede in layouts/index.html.
  description = 'A C++23 and CUDA reference implementation of LLM inference - Gemma 4, Llama 3.x and GPT-2 built from explicit components you can read and understand, validated token-for-token against HuggingFace, on consumer hardware.'
  repo = 'https://github.com/ToddThomson/Mila'
  email = 'todd.thomson@me.com'

# The landing page's three claims. One-word lead, one line. Any number here is measured --
# the perf figures come from Discussion #17 (RTX 4070 12 GB vs llama.cpp under LM Studio at
# Q4_K_M, 48K context). Update them only from a real measurement.
# Static claims -- no links. They sit above the destination boxes, whose job is to be the
# way deeper; making these clickable competed with that and exited the site.
#
# ORDER IS THE ARGUMENT. Differentiator, then credibility, then the surprise. Speed comes last
# and is stated as a RATIO that concedes the gap: on a reference implementation the number's job
# is to prove explicitness is free, not to enter a throughput race Mila is not running
# (MilaProductFamily.md: "judged by craft ... not by throughput leaderboards").
#
# Three claims, and the code demonstration below the row is a fourth statement in its own right.
# There is deliberately NO "Typed"/"Compile-time" card: it asserted exactly what the snippet
# demonstrates, and a claim standing next to its own evidence is redundant -- the evidence wins.
[[params.features]]
  lead = 'Explicit'
  text = 'No execution engine. Your application owns `main()` and the loop; Mila makes the model an ordinary C++ object inside them.'
[[params.features]]
  lead = 'Validated'
  text = 'Gemma 4, Llama 3.x and GPT-2 each reproduce a HuggingFace reference **token-for-token**, at their target precisions.'
[[params.features]]
  lead = 'Fast'
  text = 'Within **1.03x** of llama.cpp on decode and **1.14x** on prefill at long context, measured on a consumer RTX 4070.'

# The validated surface, short form. The README table is the long form.
[[params.models]]
  name = 'Gemma 4 12B Instruct'
  precision = 'FP4'
  note = 'Flagship, chat default. Sliding-window local/global attention, dual RoPE, GeGLU.'
[[params.models]]
  name = 'Llama 3.1 8B Instruct'
  precision = 'FP4 / FP8'
  note = '~6 GB at FP4, the small-footprint workhorse.'
[[params.models]]
  name = 'Llama 3.2 3B Instruct'
  precision = 'BF16 / FP8 / FP4'
  note = 'Instruction following and tool calling validated.'
[[params.models]]
  name = 'Llama 3.2 1B'
  precision = 'FP32'
  note = 'The smallest full-lineage reference.'
[[params.models]]
  name = 'GPT-2'
  precision = 'FP32 / BF16'
  note = 'Where Mila started, and its training reference.'

# Nav mirrors the hero's intent order: understand -> read -> build, then reference material.
# "Documentation" is the NARRATIVE section (what Mila is, how it works, the reading path); the
# generated Doxygen is "API reference". Pointing "Documentation" at a generated class index is a
# mislabel -- it is not what a developer scanning that word expects to find.
# Contact dropped: it was only an anchor to the foot of the home page, and Discussions, Issues and
# GitHub already cover reaching a person.
[[params.nav]]
  name = 'Documentation'
  url = 'docs/'
[[params.nav]]
  name = 'Blog'
  url = 'blog/'
[[params.nav]]
  name = 'Get started'
  url = 'start/'
[[params.nav]]
  name = 'API reference'
  url = 'api/'
# Sponsor is deliberately NOT in the nav -- it is a narrow ask aimed at a very small population who
# will arrive already interested, not by scanning a menu. It keeps a home-page band and a footer
# link, which is site-wide reachability at near-zero attention cost.
[[params.nav]]
  name = 'GitHub'
  url = 'https://github.com/ToddThomson/Mila'
